# Vector Sigma — self-host deploy example.
#
# Quickstart (see deploy/README.md):
#   cp deploy/.env.example deploy/.env   # edit: set real secrets
#   docker compose -f deploy/compose.yaml up -d --build
#   curl http://127.0.0.1:3000/healthz
#
# Interpolation is fail-closed: every ${VAR:?} aborts `compose config` when
# deploy/.env does not define it — no silent defaults for secrets.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  # f57.12: one-shot provisioning of the gateway's database — idempotent,
  # safe on every boot and on existing volumes. Same image the balena app
  # builds; the script reads interpolated env (PGPASSWORD from .env) here.
  litellm-init:
    build:
      context: ./balena/registrar
      dockerfile: Dockerfile.litellm-init
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set in deploy/.env}
      PGDATABASE: ${POSTGRES_DB:?set in deploy/.env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      LITELLM_PG_PASSWORD: ${LITELLM_PG_PASSWORD:?set in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # f57.12: the VS fleet's own LiteLLM gateway — same image as the balena app
  # (config baked by Dockerfile.litellm), same env contract (passwords via
  # .env here, balenaCloud fleet variables on the device). DATABASE_URL is
  # assembled by the image's entrypoint shim from the parts below.
  litellm:
    build:
      context: ./balena/registrar
      dockerfile: Dockerfile.litellm
    environment:
      LITELLM_PG_USER: litellm
      LITELLM_PG_HOST: postgres
      LITELLM_PG_PORT: "5432"
      LITELLM_PG_DB: litellm
      LITELLM_PG_PASSWORD: ${LITELLM_PG_PASSWORD:?set in deploy/.env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in deploy/.env}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:?set in deploy/.env}
      OLLAMA_CLOUD_API_BASE: ${OLLAMA_CLOUD_API_BASE:-https://ollama.com/v1}
    depends_on:
      postgres:
        condition: service_healthy
      litellm-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  registrar:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "3000"
      MIGRATE_ON_START: "true"
      SESSION_SECRET: ${SESSION_SECRET:?set in deploy/.env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback-only publish: the registrar is reached over the LAN only via a
    # reverse proxy the operator chooses (Caddy/nginx/Tailscale); it never
    # binds a public interface by default.
    ports:
      - "127.0.0.1:${REGISTRAR_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata: