# Vector Sigma — self-host deploy example.
#
# Quickstart (see deploy/README.md):
#   cp deploy/.env.example deploy/.env   # edit: set real secrets
#   docker compose -f deploy/compose.yaml up -d --build
#   curl https://vsigma.lan/healthz --cacert vs-tls/vs-ca.crt   # via the caddy TLS edge (f57.13)
#
# Interpolation is fail-closed: every ${VAR:?} aborts `compose config` when
# deploy/.env does not define it — no silent defaults for secrets.
#
# f57.13: the composition's front door is caddy (TLS from the VS-own
# internal CA — generate with scripts/gen-vs-ca.sh; see docs/tls-runbook.md).
# registrar + litellm are compose-internal; caddy publishes 443 (registrar:
# admin + API) and 8443 (litellm gateway + /ui + /a2a/*); port 80 redirects.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  # f57.12: one-shot provisioning of the gateway's database — idempotent,
  # safe on every boot and on existing volumes. Same image the balena app
  # builds; the script reads interpolated env (PGPASSWORD from .env) here.
  # Build context = balena/registrar (relative to THIS compose file) — the
  # same context root the balena app uses, so the Dockerfile's COPY paths
  # resolve identically on both sides (balena remote builders receive only
  # the app dir, so the context cannot be broader).
  litellm-init:
    build:
      context: ../balena/registrar
      dockerfile: Dockerfile.litellm-init
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set in deploy/.env}
      PGDATABASE: ${POSTGRES_DB:?set in deploy/.env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      LITELLM_PG_PASSWORD: ${LITELLM_PG_PASSWORD:?set in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # f57.12: the VS fleet's own LiteLLM gateway — same image as the balena app
  # (config baked by Dockerfile.litellm), same env contract (passwords via
  # .env here, balenaCloud fleet variables on the device). DATABASE_URL is
  # assembled by the image's entrypoint shim from the parts below. Build
  # context = balena/registrar (relative to this compose file) — same context
  # root as the balena app build, so the Dockerfile bytes never fork.
  litellm:
    build:
      context: ../balena/registrar
      dockerfile: Dockerfile.litellm
    environment:
      LITELLM_PG_USER: litellm
      LITELLM_PG_HOST: postgres
      LITELLM_PG_PORT: "5432"
      LITELLM_PG_DB: litellm
      LITELLM_PG_PASSWORD: ${LITELLM_PG_PASSWORD:?set in deploy/.env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in deploy/.env}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:?set in deploy/.env}
      OLLAMA_CLOUD_API_BASE: ${OLLAMA_CLOUD_API_BASE:-https://ollama.com/v1}
    depends_on:
      postgres:
        condition: service_healthy
      litellm-init:
        condition: service_completed_successfully
    # f57.13 (Copilot review): NO host publish — the plaintext 127.0.0.1:4000
    # bypass is gone; the gateway is reachable only through the caddy TLS
    # edge at https://<TLS_HOSTNAME>:8443. E2E asserts it there (AC9).
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # f57.13: one-shot TLS material provisioning (same image as the balena
  # app — context balena/registrar, Dockerfile.certs-init). ${VAR:?}
  # interpolation here vs fleet variables on balena; identical decode bytes.
  certs-init:
    build:
      context: ../balena/registrar
      dockerfile: Dockerfile.certs-init
    environment:
      CERTS_DIR: /certs
      TLS_CERT_B64: ${TLS_CERT_B64:?set in deploy/.env — paste from scripts/gen-vs-ca.sh output (b64-cert.env)}
      TLS_KEY_B64: ${TLS_KEY_B64:?set in deploy/.env — paste from scripts/gen-vs-ca.sh output (b64-cert.env)}
    volumes:
      - caddy-certs:/certs
    restart: "no"

  # f57.13: the TLS edge (same image as the balena app). TLS_HOSTNAME feeds
  # the Caddyfile's {$TLS_HOSTNAME:...} substitution; the two publish ports
  # are the composition's only exposed surface (registrar :443, litellm
  # :8443; port 80 = 308 redirect). The balenaCloud public-URL equivalent
  # (device port 80) therefore lands on the redirect — intentional, see
  # the README.
  caddy:
    build:
      context: ../balena/registrar
      dockerfile: Dockerfile.caddy
    environment:
      TLS_HOSTNAME: ${TLS_HOSTNAME:-vsigma.lan}
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - caddy-certs:/certs
    depends_on:
      - certs-init
    healthcheck:
      # Real TLS readiness (Copilot f57.13 review): the entrypoint is still
      # PID 1 while waiting for certs, so process liveness would report a
      # "healthy" edge before any cert exists. Probe the actual front door:
      # caddy serving the pinned hostname over TLS. caddy:2-alpine ships
      # curl; --insecure because THIS check is about the server having a
      # usable pair loaded, not about the client trusting the CA.
      test: ["CMD-SHELL", "curl -fsk --resolve {$TLS_HOSTNAME:vsigma.lan}:443:127.0.0.1 https://{$TLS_HOSTNAME:vsigma.lan}/healthz -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  registrar:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "3000"
      MIGRATE_ON_START: "true"
      SESSION_SECRET: ${SESSION_SECRET:?set in deploy/.env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    # f57.13 (Copilot review): NO host publish — the plaintext 127.0.0.1:3000
    # bypass is gone; the registrar is reachable only through the caddy TLS
    # edge at https://<TLS_HOSTNAME> (443). E2E rides the edge end-to-end.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped

# f57.13: shared TLS material (PEM pair decoded from TLS_CERT_B64 /
# TLS_KEY_B64 by certs-init; caddy serves it). Same volume name on the
# balena side (caddy-certs).
volumes:
  pgdata:
  caddy-certs: