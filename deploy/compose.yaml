# Vector Sigma — self-host deploy example.
#
# Quickstart (see deploy/README.md):
#   cp deploy/.env.example deploy/.env   # edit: set real secrets
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml cp \
#     caddy:/data/caddy/pki/authorities/local/root.crt ./vs-ca.crt
#   curl https://vsigma.lan/healthz --cacert vs-ca.crt   # via the caddy TLS edge (f57.13)
#
# Interpolation is fail-closed: every ${VAR:?} aborts `compose config` when
# deploy/.env does not define it — no silent defaults for secrets.
#
# f57.13: the composition's front door is caddy, TLS via `tls internal` —
# Caddy's own local CA, self-provisioned on first boot and renewed
# automatically thereafter (see docs/tls-runbook.md). registrar + litellm
# are compose-internal; caddy publishes 443 (registrar: admin + API) and
# 8443 (litellm gateway + /ui + /a2a/*); port 80 redirects.

services:
  # postgres: the stock 16-alpine image WRAPPED (fleet-ops-anc) — same image
  # the balena app builds, one-artifact/no-twin-drift contract. The wrapper
  # provisions the gateway's role + database on every boot (idempotent, safe
  # on the live volume); the retired one-shot litellm-init service is gone.
  postgres:
    build:
      context: ../balena/registrar
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in deploy/.env}
      # Superuser credential for the wrapper's provisioning psql (the old
      # one-shot read the same value; PGUSER/PGDATABASE fall back to the
      # POSTGRES_* values the image itself consumes).
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      # Password for the gateway's `litellm` role the wrapper mints.
      LITELLM_PG_PASSWORD: ${LITELLM_PG_PASSWORD:?set in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 24
    stop_grace_period: 60s
    restart: unless-stopped

  # f57.12 (consolidated fleet-ops-anc, 2026-09-29): the VS fleet's own LiteLLM
  # gateway — same image as the balena app (config baked by Dockerfile.litellm),
  # same env contract (passwords via .env here, balenaCloud fleet variables on
  # the device). DATABASE_URL is assembled by the image's entrypoint shim from
  # the parts below. Build context = balena/registrar (relative to this compose
  # file) — same context root as the balena app build, so the Dockerfile bytes
  # never fork. The gateway's role + database are provisioned by the postgres
  # service's own wrapper image on every boot — no ordering dependency needed
  # (the litellm entrypoint retry-cycles its DB connection).
  litellm:
    build:
      context: ../balena/registrar
      dockerfile: Dockerfile.litellm
    environment:
      LITELLM_PG_USER: litellm
      LITELLM_PG_HOST: postgres
      LITELLM_PG_PORT: "5432"
      LITELLM_PG_DB: litellm
      LITELLM_PG_PASSWORD: ${LITELLM_PG_PASSWORD:?set in deploy/.env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in deploy/.env}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:?set in deploy/.env}
      OLLAMA_CLOUD_API_BASE: ${OLLAMA_CLOUD_API_BASE:-https://ollama.com/v1}
    depends_on:
      postgres:
        condition: service_healthy
    # f57.12 (fleet-ops-anc): the litellm-init completion gate is GONE — the
    # postgres wrapper provisions the role+database before its own
    # healthcheck can pass, so service_healthy is now the stronger gate.
    # f57.13 (Copilot review): NO host publish — the plaintext 127.0.0.1:4000
    # bypass is gone; the gateway is reachable only through the caddy TLS
    # edge at https://<TLS_HOSTNAME>:8443. E2E asserts it there (AC9).
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # f57.13: the TLS edge (same image as the balena app). TLS_HOSTNAME feeds
  # the Caddyfile's {$TLS_HOSTNAME:...} substitution; the two publish ports
  # are the composition's only exposed surface (registrar :443, litellm
  # :8443; port 80 = 308 redirect). The balenaCloud public-URL equivalent
  # (device port 80) therefore lands on the redirect — intentional, see
  # the README. `tls internal` self-provisions on first boot — no
  # dependency on a provisioning service; caddy-data MUST be a named
  # volume or every `up` mints a fresh, untrusted CA (docs/tls-runbook.md).
  caddy:
    build:
      context: ../balena/registrar
      dockerfile: Dockerfile.caddy
    environment:
      TLS_HOSTNAME: ${TLS_HOSTNAME:-vsigma.lan}
      # 77i: the scotty basic_auth hash (bcrypt). The Caddyfile consumes
      # it via {$SCOTTY_BASIC_AUTH_HASH} substitution at adapt time —
      # NO default: an unset variable fails caddy loudly (fail-loud
      # gate; the e2e ships the committed simulation hash in .env.e2e,
      # production carries the owner-minted fleet variable).
      SCOTTY_BASIC_AUTH_HASH: "${SCOTTY_BASIC_AUTH_HASH:?set SCOTTY_BASIC_AUTH_HASH (e2e ships it in deploy/.env.e2e; balena carries the fleet variable)}"
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "8444:8444"
    volumes:
      - caddy-data:/data
    healthcheck:
      # Real TLS readiness (Copilot f57.13 review): the entrypoint is still
      # PID 1 while waiting for certs, so process liveness would report a
      # "healthy" edge before any cert exists. Probe the actual front door:
      # caddy serving the pinned hostname over TLS. The hostname comes from
      # the TLS_HOSTNAME environment variable at runtime (NOT compose
      # interpolation — {$...} here would be eaten by the ${VAR} parser).
      # caddy:2-alpine ships curl; --insecure because THIS check is about
      # the server having a usable pair loaded, not client CA trust.
      test: ["CMD-SHELL", "curl -fsk --resolve \"$${TLS_HOSTNAME:-vsigma.lan}:443:127.0.0.1\" \"https://$${TLS_HOSTNAME:-vsigma.lan}/healthz\" -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  registrar:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "3000"
      MIGRATE_ON_START: "true"
      SESSION_SECRET: ${SESSION_SECRET:?set in deploy/.env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
    # f57.13 (Copilot review): NO host publish — the plaintext 127.0.0.1:3000
    # bypass is gone; the registrar is reachable only through the caddy TLS
    # edge at https://<TLS_HOSTNAME> (443). E2E rides the edge end-to-end.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    restart: unless-stopped

  # ── f57.15 BEGIN: the VS queue plane (dolt + scotty), deploy parity ─────────
  # Byte-identical shape to balena/registrar/docker-compose.yml (same image
  # pins, same healthchecks, same read-only posture). Interpolation is
  # fail-closed here (deploy's ${VAR:?} pattern): DOLT_PASSWORD +
  # DOLT_ROOT_PASSWORD + BEADS_DOLT_PASSWORD must exist in deploy/.env.
  dolt:
    image: dolthub/dolt-sql-server:2.3.5
    environment:
      DOLT_DATABASE: vs_ops
      DOLT_USER: vs
      DOLT_PASSWORD: ${DOLT_PASSWORD:?set in deploy/.env}
      DOLT_ROOT_PASSWORD: ${DOLT_ROOT_PASSWORD:?set in deploy/.env}
      DOLT_USER_HOST: "%"
    volumes:
      - doltdata:/var/lib/dolt
    ports:
      # Self-host: LAN queue access mirrors the balena posture (host 3326 ->
      # container 3306). Operators wanting it loopback-only can drop the
      # publish — devices then cannot bd-join, which defeats the queue
      # contract; documented in scripts/vs-queue-bootstrap.md.
      - "3326:3306"
    healthcheck:
      # Same authenticated liveness probe as the balena side, with the
      # dolt client flags as GLOBAL flags BEFORE the sql subcommand (the
      # CLI rejects them after the subcommand — proven live against dolt
      # 2.3.5) and app-user auth (root is passworded via
      # DOLT_ROOT_PASSWORD; a passwordless root probe is Access-denied).
      # `$$` defers expansion to the in-container shell: compose config-time
      # interpolation would bake the secret into `docker inspect` output;
      # runtime expansion reads the service's own environment.
      test: ["CMD-SHELL", "dolt --host 127.0.0.1 --port 3306 --no-tls -u vs -p \"$$DOLT_PASSWORD\" sql -q 'select current_timestamp();'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  scotty:
    # Self-host builds the same patched image; build context is repo-root
    # relative to THIS compose file (context: ../balena/registrar — the
    # f57.12 e5b6905 lesson: compose build contexts resolve against the
    # compose file's dir).
    build:
      context: ../balena/registrar
      dockerfile: Dockerfile.scotty
    environment:
      SCOTTY_READ_ONLY: "1"
      BEADS_REPO: /queue-join
      BEADS_DOLT_PASSWORD: ${BEADS_DOLT_PASSWORD:?set in deploy/.env}
    depends_on:
      dolt:
        condition: service_healthy
    # 77i: NO host publish — scotty is fronted by caddy at
    # https://<TLS_HOSTNAME>:8444 (basic_auth + internal CA). The raw
    # 3306:3306 host publish is DROPPED in this same release; the
    # compose-internal :3306 listener (healthcheck + bd bridge) is
    # untouched.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3306/api/projects').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
  # ── f57.15 END ──────────────────────────────────────────────────────────────

  # ── f57.14 BEGIN: primus — the VS coordinator Hermes, self-bootstrapped ────
  # deploy parity with balena/registrar/docker-compose.yml (same image pin,
  # same volume, same ordering; secrets via .env here vs balenaCloud device
  # variables there — one env contract, two delivery paths, no twin drift).
  # The dogfood proof: primus bootstraps through the same chain every
  # device uses — registrant-own fetches its bundle from the registrar and
  # gates the hermes service on the ready marker.
  hermes:
    # b1r (2026-09-29): the custom primus image — the pinned official
    # Hermes image (the SAME v2026.9.21 tag this service pulled before)
    # + bd 1.2.2 baked full read-write (primus is the queue CURATOR —
    # create/close/claim beads; not scotty's bd-readonly posture) + the
    # config-only queue join + the environment docs + the boot hook.
    # Owner ruling: fully rebuildable from the repo with zero manual
    # steps. Byte-parity with the balena app compose: same Dockerfile,
    # same tag pin, same volume/env contract — one artifact, no twin
    # drift. Build context is balena/registrar (repo-root-relative to
    # THIS compose file — the f57.12 e5b6905 lesson: compose build
    # contexts resolve against the compose file's dir).
    build:
      context: ../balena/registrar
      dockerfile: Dockerfile.hermes
    # The image's CMD default is a bare REPL — exits on EOF with closed
    # stdin (run-3 lesson). Canonical long-run form per the upstream
    # reference compose: `gateway run`.
    command: ["gateway", "run"]
    environment:
      HERMES_HOME: /data/primus
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      # Read the registrant-written (uid 1000) bundle on the shared volume —
      # the image's HERMES_UID remap mechanism (run-4 lesson: uid 10000
      # cannot read the 0600 files otherwise).
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      # b1r: the in-image bd (the queue client) reads the Dolt password
      # from BEADS_DOLT_PASSWORD — the scotty service's posture exactly:
      # SAME secret value as the dolt service's DOLT_PASSWORD (one owner-
      # minted secret, two env keys because bd and the dolt image read
      # different keys). Fail-closed ${VAR:?} interpolation — without the
      # value the container never starts half-configured.
      BEADS_DOLT_PASSWORD: ${BEADS_DOLT_PASSWORD:?set in deploy/.env — same value as DOLT_PASSWORD}
    volumes:
      - primus-data:/data/primus
    depends_on:
      registrant-own:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # f57.14: the master's own registrant (build context = balena/registrar
  # — the vendored registrant-own/ tree lives beside the other app sources;
  # same context-root discipline as the litellm/caddy/scotty builds).
  # REGISTRAR_KEY is a secret (.env); the UUID + URL are structural.
  registrant-own:
    build:
      context: ../balena/registrar/registrant-own
      dockerfile: Dockerfile
    environment:
      BALENA_DEVICE_UUID: ${PRIMUS_DEVICE_UUID:?set in deploy/.env — the master device UUID}
      REGISTRAR_URL: http://registrar:3000
      REGISTRAR_KEY: ${PRIMUS_REGISTRAR_KEY:?set in deploy/.env — the primus row's registrar key}
    volumes:
      - primus-data:/data/agent
    depends_on:
      registrar:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  # ── f57.14 END ──────────────────────────────────────────────────────────────

volumes:
  pgdata:
  # f57.13 (Caddy-internal-CA rewrite): Caddy's self-generated CA key +
  # leaf certs live here — must persist, or every recreate mints a new,
  # untrusted CA. Wipe it deliberately to force a CA roll.
  caddy-data:
  # f57.15: the VS queue's Dolt state volume.
  doltdata:
  # f57.14: primus state (bundle + ready marker from registrant-own;
  # the hermes service's HERMES_HOME).
  primus-data: