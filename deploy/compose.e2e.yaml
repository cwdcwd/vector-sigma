# E2E overlay — compose-simulated device against the local registrar.
#
# Run (from the repo root, on a compose-capable host):
#   docker compose --env-file deploy/.env.e2e --env-file deploy/.env.e2e.tls \
#     -f deploy/compose.yaml -f deploy/compose.e2e.yaml -p vector-sigma-e2e up -d --build
#   deploy/e2e.sh
#   deploy/e2e.sh --down   # teardown when done
#
# OR simply: deploy/e2e.sh --up   (this script drives the full cycle and
# generates deploy/.env.e2e.tls — the throwaway E2E CA + leaf — on the way)
#
# Adds three services to the self-host example:
#   seed  — provisions the deterministic device + bundle + short-rearm slot,
#           exits 0 (gate: device waits for service_completed_successfully)
#   device— runs the REAL registrant (registrant/dist/index.js) as a
#           simulated device: bootstrap, atomic bundle apply, ready marker,
#           resident rotation watcher — exactly the balenaOS device shape,
#           minus the platform env injection (compose provides it).
# All values interpolate from deploy/.env.e2e (+ the generated
# deploy/.env.e2e.tls) — committed, deterministic, simulation-only — no
# production secrets anywhere in them.
#
# lnf (j7g phase 2): the caddy TLS edge is RETIRED - the overlay's
# TLS-simulation machinery (throwaway CA, tls-gate, caddy alias)
# is gone with it. The e2e device bootstraps against the
# LOOPBACK publish (http://127.0.0.1:3000) - the same surface the
# tailscale serve edge proxies at the MagicDNS name on the balena
# master. No CA variables exist anywhere in the composition (the
# serve edge presents Let's Encrypt certificates, publicly
# trusted); the https-on-ts.net path is canary evidence (AC4),
# exercised on the live tailnet - CI cannot join one by
# construction.

services:
  seed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "--import", "tsx", "deploy/seed/seed.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      E2E_DEVICE_UUID: ${E2E_DEVICE_UUID:?set in deploy/.env.e2e}
      E2E_DEVICE_KEY: ${E2E_DEVICE_KEY:?set in deploy/.env.e2e}
      E2E_AGENT_NAME: ${E2E_AGENT_NAME:-sim-deploy-e2e}
      # f57.11: grace-path device + admin key for the console E2E flow.
      E2E_GRACE_UUID: ${E2E_GRACE_UUID:?set in deploy/.env.e2e}
      E2E_GRACE_KEY: ${E2E_GRACE_KEY:?set in deploy/.env.e2e}
      E2E_ADMIN_KEY: ${E2E_ADMIN_KEY:?set in deploy/.env.e2e}
      # f57.14: the primus row's env (the seed inserts the coordinator's
      # device row + full bundle; primus-registrant bootstraps against it).
      PRIMUS_DEVICE_UUID: ${PRIMUS_DEVICE_UUID:?set in deploy/.env.e2e}
      PRIMUS_REGISTRAR_KEY: ${PRIMUS_REGISTRAR_KEY:?set in deploy/.env.e2e}
      # j7g.1: the mesh identity the seeded bundle carries — the simulation
      # gateway key (a mesh key IS a gateway virtual key; the round-trip
      # caller presents it and both auth layers accept it).
      E2E_MESH_IDENTITY_KEY: ${LITELLM_MASTER_KEY:?set in deploy/.env.e2e}
      # Short auto-rearm window so the re-delivery path is observable in
      # seconds (production default is 1 hour).
      SEED_REARM_SECONDS: ${SEED_REARM_SECONDS:-45}
    depends_on:
      registrar:
        condition: service_healthy
    restart: "no"


  device:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "registrant/dist/index.js"]
    depends_on:
      registrar:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    environment:
      BALENA_DEVICE_UUID: ${E2E_DEVICE_UUID:?set in deploy/.env.e2e}
      # lnf (j7g phase 2): loopback bootstrap - the same surface the
      # serve edge proxies at the MagicDNS name on the master. No CA
      # variables exist (the internal-CA machinery retired with caddy);
      # the https-on-ts.net path is AC4 canary evidence.
      REGISTRAR_URL: http://127.0.0.1:3000
      REGISTRAR_KEY: ${E2E_DEVICE_KEY:?set in deploy/.env.e2e}
      DATA_DIR: /data/agent
      # Containers have no timesyncd socket: gate expires fast and the
      # boot path proceeds best-effort (this is the no-RTC device behavior
      # the gate exists for). lnf: the loopback path carries no TLS guard
      # (the https edge is canary territory; the clock gate keeps its
      # fail-open best-effort contract).
      CLOCK_GATE_TIMEOUT_MS: "2000"
      # Long watch interval: the E2E asserts rotation separately via
      # /v1/rotate + rearm; resident polls must not race the assertions.
      WATCH_INTERVAL_MS: "600000"
      LOG_LEVEL: info
    volumes:
      - device-data:/data/agent
    restart: "no"

  # f57.11: grace-path device — PENDING row, no bundle. The registrant
  # must stay resident on 403 (ACTION REQUIRED + status poll) instead of
  # crash-looping; e2e.sh flips the row active and asserts self-heal.
  # f57.13: stays on the compose-internal http path (its job is the grace
  # path, not the TLS path; the TLS contract has its own dedicated AC).
  grace-device:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["node", "registrant/dist/index.js"]
    environment:
      BALENA_DEVICE_UUID: ${E2E_GRACE_UUID:?set in deploy/.env.e2e}
      REGISTRAR_URL: http://registrar:3000
      REGISTRAR_KEY: ${E2E_GRACE_KEY:?set in deploy/.env.e2e}
      DATA_DIR: /data/agent
      CLOCK_GATE_TIMEOUT_MS: "2000"
      # Short grace poll so self-heal is observable inside the CI budget;
      # production default is 5 minutes (owner-ruled).
      GRACE_POLL_INTERVAL_MS: "2000"
      WATCH_INTERVAL_MS: "600000"
      LOG_LEVEL: info
    volumes:
      - grace-device-data:/data/agent
    depends_on:
      registrar:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: "no"

  # f57.14: primus — the compose-simulated coordinator self-bootstrap. The
  # REAL official Hermes image + the REAL vendored registrant, riding the
  # same registrar the device uses. The overlay's job: deterministic env
  # (UUID/key from .env.e2e, seeded row) + the shared primus-data volume.
  # Assertions (e2e.sh AC12) ride the ready marker + bundle files on the
  # volume — the dogfood proof is the BOOTSTRAP CHAIN, not a live model
  # call (the seeded bundle's gateway key is a simulation value).
  # b1r: the base compose now BUILDS the custom hermes image (bd 1.2.2 +
  # queue join + docs + boot hook) — the overlay inherits the build. The
  # queue env deterministically arrives here (the base's ${VAR:?} is
  # satisfied from .env.e2e's simulation value either way; the explicit
  # entry documents the AC13 surface).
  hermes:
    environment:
      # CI determinism: the image's stage2 hook seeds config.yaml only when
      # absent; a fresh volume per run keeps the boot identical.
      HERMES_HOME: /data/primus
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      # Read the registrant-written (uid 1000) bundle on the shared volume
      # (run-4 lesson) — the base compose documents the mechanism.
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      # b1r (AC13): the in-image bd's Dolt password — same simulation
      # value the scotty service + the host-side AC10 bd client use.
      BEADS_DOLT_PASSWORD: ${BEADS_DOLT_PASSWORD:?set in deploy/.env.e2e — simulation value}
    # Long-run form (the base compose carries `command: gateway run`; the
    # overlay inherits it — no override needed).
    volumes:
      - primus-data:/data/primus
    depends_on:
      primus-registrant:
        condition: service_healthy
    restart: "no"

  # f57.14: the overlay's primus registrant (the deploy image's
  # registrant-own service, renamed to keep the base service's default
  # command; the base compose defines the build, this overlay overrides
  # the env deterministically from .env.e2e). Compose-internal http —
  # the pre-TLS contract.
  primus-registrant:
    build:
      context: ../balena/registrar/registrant-own
      dockerfile: Dockerfile
    environment:
      BALENA_DEVICE_UUID: ${PRIMUS_DEVICE_UUID:?set in deploy/.env.e2e}
      REGISTRAR_URL: http://registrar:3000
      REGISTRAR_KEY: ${PRIMUS_REGISTRAR_KEY:?set in deploy/.env.e2e}
      DATA_DIR: /data/agent
      CLOCK_GATE_TIMEOUT_MS: "2000"
      # Long watch: AC12 asserts the bootstrap artifacts, not rotation.
      WATCH_INTERVAL_MS: "600000"
      LOG_LEVEL: info
    volumes:
      - primus-data:/data/agent
    healthcheck:
      # THE gate hermes waits on (run-2 lesson: depends_on service_healthy
      # is unsatisfiable without a healthcheck). Marker-based, not process
      # liveness: healthy == the bootstrap chain completed and identity
      # exists on the shared volume — hermes starts only then (its own
      # entrypoint re-gates on the same marker structurally). A failed
      # bootstrap (grace-poll resident, no marker) keeps this red and
      # fails compose up loudly.
      test: ["CMD-SHELL", "test -f /data/agent/ready.marker"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    depends_on:
      registrar:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: "no"

networks:
  default: {}

volumes:
  device-data:
  grace-device-data:
  # f57.14: primus state (shared by primus-registrant + hermes).
  primus-data: