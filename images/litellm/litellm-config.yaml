# images/litellm/litellm-config.yaml — the vector-sigma fleet's OWN LiteLLM
# gateway config (fleet-ops-f57.12, owner ruling 2026-09-20 "option 1": the VS
# master device runs identity + gateway + mesh on its own hardware; the VS
# fleet never couples to the origin fleet's ai.lan — clean-start principle).
#
# STRUCTURAL config only — no secrets in this file or in any image layer (VS
# security model). Every secret below is read from the environment at boot:
#   LITELLM_MASTER_KEY    balenaCloud fleet var (owner-minted, 600-equivalent
#                        custody; must start with "sk-" per LiteLLM)
#   DATABASE_URL         assembled by litellm-entrypoint.sh from LITELLM_PG_*
#                        parts + the LITELLM_PG_PASSWORD fleet var
#   OLLAMA_CLOUD_API_KEY balenaCloud fleet var
#   OLLAMA_CLOUD_API_BASE fleet var override; public default in the compose
#
# DATABASE DECISION (AC 2, builder rationale): dedicated `litellm` database +
# least-privilege role on the SHARED postgres service — not a sqlite volume.
# LiteLLM virtual keys (the whole vs-optimus-prime re-mint story) and the A2A
# agent registry are POSTGRES-ONLY features; sqlite would silently forfeit
# both. The `litellm` role owns ONLY the `litellm` database and holds no
# grants on the registrar's database (which additionally gets CONNECT revoked
# from PUBLIC). Provisioning is done by the postgres service's own wrapper
# image (fleet-ops-anc) on every boot in both compose files — see README
# "The VS gateway (LiteLLM)".
#
# This file is baked to /app/config.yaml by images/litellm/Dockerfile (the balena
# supervisor cannot bind-mount files into services). platforms/compose/ self-host runs
# the SAME image from the SAME Dockerfile — one source of truth, no twin
# drift possible.

model_list:
  # Explicit entries — j9f lesson applied verbatim: the wildcard can NEVER
  # serve as a fallback target, so every fallback endpoint (below) must be a
  # real, explicitly-listed model group.
  # Ollama Cloud's OpenAI-compatible endpoint reuses response ids
  # chatcmpl-0..999. LiteLLM uses those ids as unique SpendLogs request_id
  # values and skip_duplicates silently drops successful rows on collision.
  - model_name: ollama-cloud/glm-5.3
    litellm_params:
      model: ollama_chat/glm-5.3
      api_base: https://ollama.com  # Native /api/chat endpoint; intentionally no /v1.
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
    # Pricing as of 2026-10-17, ollama.com/pricing, per the plan §1.2 — re-verify on upgrade.
    # glm-5.3 and glm-5.2 have identical pricing rows.
    model_info:
      max_input_tokens: 1000000
      input_cost_per_token: 0.0000014
      cache_read_input_token_cost: 0.00000026
      output_cost_per_token: 0.0000044
  # Same reused-id collision and silent SpendLogs skip_duplicates failure mode.
  - model_name: ollama-cloud/glm-5.2
    litellm_params:
      model: ollama_chat/glm-5.2
      api_base: https://ollama.com  # Native /api/chat endpoint; intentionally no /v1.
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
    # Pricing as of 2026-10-17, ollama.com/pricing, per the plan §1.2 — re-verify on upgrade.
    # Same prices as glm-5.3; the two Ollama pricing rows are identical.
    model_info:
      input_cost_per_token: 0.0000014
      cache_read_input_token_cost: 0.00000026
      output_cost_per_token: 0.0000044
    # TODO: repository docs do not verify a glm-5.2 context limit; do not guess.
  - model_name: ollama-cloud/glm-5.3-flash
    # ROLE: default — cheaper per typical input-dominated agent turn.
    litellm_params:
      model: ollama_chat/glm-5.3-flash
      api_base: https://ollama.com  # Native /api/chat endpoint; intentionally no /v1.
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
    # Pricing as of 2026-10-17, ollama.com/pricing, per 1M tokens.
    model_info:
      max_input_tokens: 1000000
      input_cost_per_token: 0.00000015
      cache_read_input_token_cost: 0.00000003
      output_cost_per_token: 0.0000005
  - model_name: ollama-cloud/nemotron-3-super
    # ROLE: background and cron — near-zero input cost; not for real work.
    litellm_params:
      model: ollama_chat/nemotron-3-super
      api_base: https://ollama.com  # Native /api/chat endpoint; intentionally no /v1.
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
    # Pricing as of 2026-10-17, ollama.com/pricing, per 1M tokens.
    model_info:
      input_cost_per_token: 0.000000015
      cache_read_input_token_cost: 0.000000015
      output_cost_per_token: 0.0000006
    # TODO: repository docs do not verify a context limit; do not guess.
  - model_name: ollama-cloud/deepseek-v4.1-flash
    # ROLE: fallback — cheapest cached input; half price off-peak upstream.
    litellm_params:
      model: ollama_chat/deepseek-v4.1-flash
      api_base: https://ollama.com  # Native /api/chat endpoint; intentionally no /v1.
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
    # Pricing as of 2026-10-17, ollama.com/pricing, per 1M tokens.
    # Off-peak pricing row also exists upstream; no off-peak variant is configured.
    model_info:
      input_cost_per_token: 0.0000003
      cache_read_input_token_cost: 0.000000006
      output_cost_per_token: 0.0000012
    # TODO: repository docs do not verify a context limit; do not guess.
  # Wildcard pass-through (mirrors the origin fleet's gateway shape): routes any other
  # model name to Ollama Cloud's OpenAI-compatible /v1 endpoint. It ROUTES but
  # cannot failover — never list "*" as a fallback target (j9f).
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_base: os.environ/OLLAMA_CLOUD_API_BASE
      api_key: os.environ/OLLAMA_CLOUD_API_KEY
  # Future anthropic lane — uncomment when ANTHROPIC_API_KEY joins the
  # variable contract. Deliberately NO "claude"/"anthropic" substring in the
  # alias (ai.lan lesson: clients that name-sniff those substrings route
  # natively and bypass gateway auth):
  # - model_name: gw-sonnet
  #   litellm_params:
  #     model: anthropic/claude-sonnet-5
  #     api_key: os.environ/ANTHROPIC_API_KEY


# auto_router template (opt-in only; every line remains commented).
# EXAMPLES only: replace these aliases with model groups configured by the operator.
# SIMPLE uses the fleet's default flash lane; heavier tiers use glm-5.3 examples.
# Sensitive text: if routed traffic may carry sensitive free text, map every tier
# only to self-hosted model groups (define them first, then opt in). The example
# aliases above are hosted ollama-cloud lanes; the shipped config has no
# self-hosted model group, so this template must stay commented in shared defaults.
# - model_name: auto_router/complexity_router
#   litellm_params:
#     model: auto_router/complexity_router
#     complexity_router_config:
#       tiers:
#         SIMPLE: ollama-cloud/glm-5.3-flash
#         MEDIUM: ollama-cloud/glm-5.3
#         COMPLEX: ollama-cloud/glm-5.3
#         REASONING: ollama-cloud/glm-5.3
#       session_affinity: true
#       context_compaction: false
#       # 1.105.x-validated shape. Do not swap this for `auto_router_config:`:
#       # on 1.105.1 that key is a config-PATH string for LiteLLM's semantic
#       # auto-router, and its dict form fails LiteLLM_Params validation at
#       # deployment creation; a bare `context_compaction: true` also fails
#       # ComplexityRouterConfig validation. Both drop the deployment, so the
#       # alias serves 400 "no healthy deployments ... No fallback was
#       # attempted" instead of serving. With this shape enabled in a
#       # non-production 1.105.1 fixture, every exercised tier path served 200
#       # with zero ModelNotMappedError and zero fallback events (see the PR
#       # evidence comment); the sizing path that could raise uncaught
#       # ModelNotMappedError never runs with compaction false. Production
#       # upgrade smoke stays owner-gated. Topically related upstream #23054
#       # (general unmapped-model metadata/routing discussion, closed not
#       # planned). Client compression (§3.1) makes router compaction redundant.
#       # classifier_llm_config:            # LLM-judge classifier only
#       #   classification_rubric: <rubric> # heuristic classifier ignores it

router_settings:
  fallbacks:
    # Default lane escalates to glm-5.2, then heavy glm-5.3, then terminal deepseek fallback.
    - ollama-cloud/glm-5.3-flash: ["ollama-cloud/glm-5.2", "ollama-cloud/glm-5.3", "ollama-cloud/deepseek-v4.1-flash"]
    # glm-5.3 is a standalone heavy lane; glm-5.2 retains its existing recovery target.
    - ollama-cloud/glm-5.2: ["ollama-cloud/glm-5.3"]
    # Future (add with the gw-sonnet lane above):
    # - ollama-cloud/glm-5.3: ["ollama-cloud/glm-5.2", "gw-sonnet"]

general_settings:
  # The gateway may receive client IP forwarding from a front proxy. There is
  # no in-compose proxy or source-IP allowlist in this deployment; do not trust
  # XFF unless ingress is restricted to the intended proxy.
  use_x_forwarded_for: true
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
