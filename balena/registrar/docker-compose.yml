# Vector Sigma registrar-fleet app — registrar + Postgres + the VS fleet's
# own LiteLLM gateway (f57.12) on balenaOS.
#
# Runs on the `registrar` balena fleet (1 device: Raspberry Pi 5,
# architecture aarch64). This compose is read by the balena supervisor
# (compose-file v2.4 semantics), NOT plain docker compose: no `${VAR}`
# substitution — every runtime value reaches services as a
# balenaCloud dashboard variable (service-scoped). See balena/registrar/README.md
# for the variable table.
#
# NOTE: the explicit `version: "2.4"` below is load-bearing — without it
# the balena CLI falls back to the legacy v1 schema and rejects every
# modern service key with "data/services should NOT have additional
# properties" (verified against the CLI's bundled ajv schema, v24.x).
version: "2.4"
#
# Cross-fleet reachability: each balena fleet is its own VPN — devices
# on the devices fleet CANNOT resolve this device over balena's
# internal network. The registrar therefore publishes on the device's
# LAN interfaces at the standard HTTP port: host 80 -> container 3000.
# Devices reach it via REGISTRAR_URL=http://<this-device-LAN-IP> (no
# port suffix — port 80 is implied); previously this documented :3000,
# which stopped being the published port in fleet-ops-f57.9. TLS remains
# out of scope (spec: off-LAN deployments TAGGED FOR LATER REVIEW) —
# the registrar sits on a trusted LAN only. The balenaCloud public-URL
# feature (device page -> PUBLIC URL toggle) tunnels to DEVICE port 80
# ONLY, which is why the host side of this publish is 80 and not an
# arbitrary high port.
#
# Secrets posture: no secrets in image layers or this file
# (fleet-ops-f57.8). POSTGRES_USER / POSTGRES_DB / DB_HOST /
# MIGRATE_ON_START ship here as static structural values; the owner sets
# only two secrets as balenaCloud dashboard variables: POSTGRES_PASSWORD
# (fleet-wide, so postgres and registrar see the same value) and
# SESSION_SECRET (registrar service). Dashboard variables override the
# static compose environment below.
#
# f57.12 gateway additions: LITELLM_MASTER_KEY, LITELLM_PG_PASSWORD and
# OLLAMA_CLOUD_API_KEY are owner-set balenaCloud FLEET variables (the bead's
# variable contract — fleet scope per the spec; service scope would be a
# hardening option, noted in the README). OLLAMA_CLOUD_API_BASE ships as a
# STATIC value in the litellm service environment (public endpoint, not a
# secret); override via dashboard variable only if Ollama Cloud's URL ever
# changes. The gateway's postgres role + database are provisioned by the
# postgres service's own wrapper image (fleet-ops-anc, 2026-09-29) — the
# retired one-shot litellm-init service no longer exists.
#
# lnf (j7g phase 2) — the serve-only edge: caddy is GONE from this
# composition (owner GO 2026-10-04). The tailscale service's serve
# config fronts the three management surfaces at the MagicDNS names
# with Let's Encrypt certificates (auto-provisioned + renewed inside
# tailscaled; browser-trusted everywhere, zero root installs); every
# service publishes on 127.0.0.1 loopback ONLY — the LAN front door
# (80/443/8443/8444) this release retires. The internal-CA +
# VS_CA_CERT_B64 machinery is retired repo-wide; basic_auth dies with
# caddy (scotty's lock is the tailnet ACL tag + TLS identity alone).
# See docs/tailscale-runbook.md (phase 2) and docs/tls-runbook.md
# (rewritten for the serve-only edge).

services:
  # postgres: the stock 16-alpine image WRAPPED (fleet-ops-anc, owner ruling
  # 2026-09-29 — consolidate, kill the one-shot container). The wrapper runs
  # the provisioning SQL the retired litellm-init service ran, on every boot,
  # idempotent — the gateway's `litellm` role + database exist before the
  # litellm service can possibly start racing them, and the device runs one
  # fewer container. Same base image, same volume, same healthcheck; secrets
  # contract unchanged (POSTGRES_PASSWORD + LITELLM_PG_PASSWORD arrive as
  # balenaCloud fleet variables, never in image layers).
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      # Structural, non-secret (fleet-ops-f57.8): the role + database the
      # postgres image creates at first init of the data volume. The
      # registrar service carries the SAME values so the URL it builds
      # from parts cannot disagree with what postgres created.
      POSTGRES_USER: vsigma
      POSTGRES_DB: vsigma
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready only proves the server accepts connections — but it
      # prints "role does not exist" FATAL noise every 5s when
      # POSTGRES_USER is not literally "postgres" (auth happens after
      # the role lookup, and the FATAL lands in logs regardless of
      # pg_isready's exit code). Probe the role we actually create.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 24
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  registrar:
    build:
      context: ./registrar
      dockerfile: Dockerfile
    environment:
      # Structural (fleet-ops-f57.8): the registrar builds DATABASE_URL
      # from POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB/DB_HOST/DB_PORT
      # when DATABASE_URL is unset — the owner sets only POSTGRES_PASSWORD
      # (+ SESSION_SECRET) as balena variables. Same structural values as
      # the postgres service above so the built URL always agrees with
      # what postgres created.
      POSTGRES_USER: vsigma
      POSTGRES_DB: vsigma
      DB_HOST: postgres
      MIGRATE_ON_START: "true"
    # lnf (j7g phase 2): 127.0.0.1-ONLY host publish. tailscaled runs in
    # the host network namespace and cannot reach compose-network names,
    # so the serve edge proxies at the loopback publish: the baked
    # serve config (serve-config.json) fronts registrar at the MagicDNS
    # name :443 -> http://127.0.0.1:3000. The IP-prefixed publish is
    # the supervisor dialect this lane exercises (bead supervisor fact
    # 1): 127.0.0.1:3000:3000 binds loopback ONLY — the LAN front door
    # this release retires. Compose-internal access (deploy/ self-host
    # example, E2E seed, registrant-own) keeps using http://registrar:3000
    # over the compose network, untouched.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  # f57.12 (consolidated fleet-ops-anc, 2026-09-29): the VS fleet's own
  # LiteLLM gateway — models front door + virtual keys + the /a2a/* mesh for
  # VS devices. Same image the deploy/ self-host example builds (config baked
  # by Dockerfile.litellm — the supervisor cannot bind-mount). lnf (j7g
  # phase 2): the serve edge fronts the gateway at the MagicDNS name
  # :8443; devices point GATEWAY_URL / A2A_PUBLIC_URL at it (flipped in
  # phase 1b — unchanged by this release). PROXY_BASE_URL stays unset
  # (cards advertise from the request Host header — now the MagicDNS
  # name the serve edge carries; the README documents the override). The
  # gateway's postgres role + database are provisioned by the postgres
  # service's own wrapper image every boot — no ordering dependency
  # needed (the litellm entrypoint retry-cycles its DB connection).
  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    environment:
      # Structural parts (the entrypoint assembles DATABASE_URL; password
      # arrives as the LITELLM_PG_PASSWORD fleet variable).
      LITELLM_PG_USER: litellm
      LITELLM_PG_HOST: postgres
      LITELLM_PG_PORT: "5432"
      LITELLM_PG_DB: litellm
      # Public structural endpoint (not a secret); owner-set fleet vars:
      # LITELLM_MASTER_KEY, LITELLM_PG_PASSWORD, OLLAMA_CLOUD_API_KEY.
      # OLLAMA_CLOUD_API_BASE ships STATIC here (anc fixes train, 2026-09-29:
      # this line was promised in the comment but absent — its absence was
      # the live root cause of the gateway completing against api.openai.com;
      # the fleet var override stays as belt-and-braces).
      OLLAMA_CLOUD_API_BASE: https://ollama.com/v1
    # lnf (j7g phase 2): 127.0.0.1-ONLY host publish — the serve edge
    # (serve-config.json) fronts the gateway at the MagicDNS name :8443 ->
    # http://127.0.0.1:4000 (tailscaled is host-netns; compose names are
    # unreachable from it). Loopback-only: the LAN front door this
    # release retires. PROXY_BASE_URL stays unset (cards advertise from
    # the request Host header — now the MagicDNS name the serve edge
    # carries; the README documents the override).
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      # Process liveness — parity with the registrar service's healthcheck
      # shape (the litellm image ships no curl/wget; /health/liveliness is
      # asserted externally by the deploy E2E smoke through the TLS edge).
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  # ── f57.15 BEGIN: the VS fleet's own queue plane (dolt + scotty) ────────────
  # Provenance: mirrors the origin fleet's central-Dolt + Scotty stack (fleet proven:
  # central Dolt :3326, scotty v0.3.0 cc55734 + the 8ea deep-link patch, bd
  # pinned at 1.2.2, BD_BIN read-only wrapper + SCOTTY_READ_ONLY=1 two-layer
  # posture). Owner ruling: VS queue is fully self-contained — VS devices run
  # bd clients against THIS dolt; cross-fleet coordination (primus <->
  # the origin-fleet coordinator) is A2A only, never shared-queue writes.
  dolt:
    image: dolthub/dolt-sql-server:2.3.5
    environment:
      # Structural (public values): the database VS bd clients join. Secrets
      # are balenaCloud fleet variables ONLY (f57.8 pattern — they do not
      # appear in this file at all, not even as empty stubs): DOLT_PASSWORD
      # (the VS queue's Dolt auth — owner-minted, 600-equivalent custody,
      # never in image layers) + DOLT_ROOT_PASSWORD (superuser; the image
      # needs it to create the app user, and root stays localhost-only by
      # image default — the queue never logs in as root over the LAN).
      DOLT_DATABASE: vs_ops
      DOLT_USER: vs
      DOLT_USER_HOST: "%"
    volumes:
      - doltdata:/var/lib/dolt
    ports:
      # Published to the device LAN: VS device bd clients reach the master
      # over the LAN exactly like REGISTRAR_URL (owner ruling: devices run bd
      # clients against it). Not reachable off-LAN: the balenaCloud public-URL
      # feature tunnels device port 80 ONLY (f57.9). origin-fleet precedent: central
      # Dolt :3326 serving every fleet client.
      - "3326:3306"
    healthcheck:
      # Dolt's documented liveness query, AUTHENTICATED, with the client
      # flags in the right position: dolt's connection flags are GLOBAL flags
      # — they must PRECEDE the subcommand (`dolt --host ... sql -q ...`);
      # placed after `sql` the CLI rejects them ("unknown option `host'",
      # proven live against dolt 2.3.5 — CI run-3's red). And the probe
      # must authenticate as the app user: once DOLT_ROOT_PASSWORD is set,
      # a root probe without a password is Access-denied (dolthub issue
      # #7428's symptom — CI run-2's red). The entrypoint creates
      # DOLT_USER/DOLT_PASSWORD before serving; the in-container shell
      # expands the password from the fleet variable at probe time (the
      # supervisor does no interpolation). Fail-closed: a missing fleet
      # variable fails the healthcheck rather than probing blind.
      test: ["CMD-SHELL", "dolt --host 127.0.0.1 --port 3306 --no-tls -u vs -p \"$DOLT_PASSWORD\" sql -q 'select current_timestamp();'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  scotty:
    build:
      context: .
      dockerfile: Dockerfile.scotty
    environment:
      # Two-layer read-only posture (origin-fleet runbook, fleet-ops-8ea):
      #   layer 1: SCOTTY_READ_ONLY=1 — scotty refuses project writes
      #   layer 2: BD_BIN wrapper (baked into the image; see bd-readonly)
      SCOTTY_READ_ONLY: "1"
      # BEADS_REPO must point at a .beads workspace. On the master device the
      # queue lives in the dolt container; scotty's bd bridge shells out to the
      # IN-IMAGE bd (wrapped read-only), which connects to the dolt service
      # over the compose network. The workspace it reads is a join-config
      # directory baked alongside (queue-join/), so no bind mount exists to
      # drift — balena supervisor allows none anyway (f57.12 precedent).
      BEADS_REPO: /queue-join
      # Dolt connection for the in-image bd (server mode): host = the compose
      # service name; the password arrives as the BEADS_DOLT_PASSWORD service
      # variable (same secret value as the dolt service's DOLT_PASSWORD — one
      # owner-minted secret, two variable names because bd and the dolt image
      # read different env keys). NEVER baked into the image (f57.8).
    depends_on:
      - dolt
    # lnf (j7g phase 2): 127.0.0.1-ONLY host publish — the serve edge
    # (serve-config.json) fronts scotty at the MagicDNS name :8444 ->
    # http://127.0.0.1:3306. Scotty's lock is now the tailnet ACL tag
    # + TLS identity ALONE (the owner GO on caddy retirement: basic_auth
    # dies with caddy; the raw LAN :3306 publish died with 77i). The
    # compose-internal :3306 listener is untouched: the healthcheck below
    # and scotty's own bd bridge ride the compose network.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # HTTP liveness: scotty serves /api/projects (the project picker's data
      # route — verified present at cc55734; there is no /api/doctor route)
      # once Next is up. bd errors surface as 5xx on project routes, so this
      # also catches a wedged bd bridge.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3306/api/projects').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always
  # ── f57.15 END ──────────────────────────────────────────────────────────────

  # ── f57.14 BEGIN: primus — the VS coordinator Hermes, self-bootstrapped ────
  # The dogfood proof: the master device's own agent bootstraps through the
  # SAME chain every device uses — the registrant-own service fetches the
  # owner-prepared primus bundle from the registrar (device row pre-created
  # in the console, agent_name=primus) and applies it to the shared
  # primus-data volume. Ordering (f57.20 short-form): registrar started
  # -> registrant-own (bootstrap poll) -> hermes started. The official
  # Hermes image has NO marker gate (f57.20 finding: zero ready.marker
  # references in the v2026.9.21 image source; the marker gate belongs
  # to the devices app's own gate.sh, not this image) — the marker is
  # the fleet's assertion signal (E2E AC12), and the marker-gap race is
  # closed by the image's first-boot-only seed + restart:always contract,
  # same as the devices app's agent runtime. See the hermes service's
  # f57.20 note.
  #
  # Hermes contract (AC1): state on the primus-data volume via
  # HERMES_HOME=/data/primus (the image's stage2 hook seeds config.yaml /
  # .env / SOUL.md only when absent — the bundle's own SOUL.md and
  # config/secrets.env land via the registrant; operator-provided values
  # win, so the FIRST boot with a bundle-present volume serves primus's
  # SOUL and credentials, and the seed never clobbers them later).
  # HERMES_GATEWAY_BOOTSTRAP_STATE=running starts the supervised gateway
  # on first boot (the image contract — only seeds when no state exists).
  hermes:
    # b1r (2026-09-29): the custom primus image — the pinned official
    # Hermes image (the SAME v2026.9.21 tag this service pulled before)
    # + bd 1.2.2 baked FULL READ-WRITE (primus is the queue CURATOR;
    # the scotty bd-readonly wrapper posture does NOT apply here) +
    # the config-only queue join + the environment docs + the boot
    # hook. Owner ruling: primus must be fully rebuildable from the
    # repo + a fresh registrar release with zero manual steps. One
    # artifact: deploy/compose.yaml builds the SAME Dockerfile — no
    # twin drift (the FROM pin stays the parity pin both sides share).
    build:
      context: .
      dockerfile: Dockerfile.hermes
    # The image's CMD default is a bare `hermes` REPL — it exits on EOF
    # when stdin closes (compose up -d). The upstream reference compose's
    # canonical long-run form (run-3 lesson): `gateway run`.
    command: ["gateway", "run"]
    environment:
      # State on the shared agent-data volume pattern (AC1: /data/primus).
      HERMES_HOME: /data/primus
      # The gateway comes up on first boot (the image's first-boot-only
      # seed contract; the persisted state wins on every later boot).
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      # The bundle on the shared volume is written by registrant-own as
      # uid/gid 1000 (the node base image's built-in user — the same
      # convention the devices app rides). The hermes runtime defaults to
      # uid 10000; without this remap it cannot read the 0600 bundle files
      # (the image's documented HERMES_UID mechanism — same as its
      # bind-mounted-host-dir guidance).
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      # b1r: the in-image bd (the queue client) reads the Dolt password
      # from BEADS_DOLT_PASSWORD — the scotty service's posture: SAME
      # secret value as the dolt service's DOLT_PASSWORD (one owner-
      # minted secret, two env keys because bd and the dolt image read
      # different keys). It arrives as a balenaCloud FLEET variable and
      # cascades to this service by default; no static value ships here
      # (f57.8 — no secrets in this file, not even as stubs). If the
      # variable is ever scoped per-service instead, hermes must be in
      # its service list or bd cannot authenticate. NEVER baked into the
      # image layers.
    volumes:
      - primus-data:/data/primus
    # j7g phase 1b (fleet-ops-lrb): static hosts pin for the master's OWN
    # MagicDNS FQDN. Primus's config references the gateway/A2A endpoints
    # (GATEWAY_URL, A2A_PUBLIC_URL per the f57.12 runbook naming) — those
    # flip to the MagicDNS name in phase 1b, and this container's DNS chain
    # (embedded 127.0.0.11 -> host dnsmasq -> upstream) has NO ts.net route
    # (the lrb canary verdict; accept-dns cannot reach the host dnsmasq
    # chain from tailscaled's own mount namespace). Same literal pair as
    # the devices compose's agent/registrant pins — the runbook's phase-1b
    # owner step names all three sites — docs/tailscale-runbook.md.
    extra_hosts:
      - "vector-sigma.tailb7207e.ts.net:100.124.197.78"
    depends_on:
      - registrant-own
    healthcheck:
      # Process liveness only: the official image has no marker gate
      # (f57.20 finding — the v2026.9.21 entrypoint/stage2 tree carries
      # zero ready.marker references; the gate belongs to the devices
      # app's gate.sh, NOT this image). hermes therefore starts as soon
      # as its container launches; the marker-gap race (hermes first
      # boot vs registrant-own apply) is closed by the image's
      # first-boot-only seed (operator files win, stage2 skips seeding
      # when the bundle's files exist) + restart:always: an unprovisioned
      # device shows hermes restart-looping in the dashboard — the same
      # surface the devices app's agent gate gives (agent Exited), and
      # the E2E marker assertion (AC12) is unaffected: it runs AFTER the
      # chain completes, not inside hermes.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  # f57.14: the master device's OWN registrant (vendored twin of the
  # devices app's registrant — same sources, same image shape). Polls the
  # compose-internal registrar over http (pre-TLS per the bead's contract:
  # never leaves the composition network) and applies the primus bundle to
  # the shared primus-data volume, writing /data/primus/ready.marker last
  # — the hermes service's gate.
  registrant-own:
    build:
      context: ./registrant-own
      dockerfile: Dockerfile
    environment:
      # The master's own balena device UUID (BALENA_DEVICE_UUID) and the
      # REGISTRAR_KEY for the primus row are balenaCloud DEVICE variables
      # (f57.8 pattern — no secrets in this file). REGISTRAR_URL is
      # structural: compose-internal http; the TLS flip (https://
      # <TLS_HOSTNAME>) rides the same sequencing as the devices fleet.
      REGISTRAR_URL: http://registrar:3000
    volumes:
      - primus-data:/data/agent
    depends_on:
      - registrar
    healthcheck:
      # Process liveness only (f57.20 note): under the supervisor this
      # healthcheck never gated hermes — depends_on long-form
      # conditions are unsupported by the supervisor (run 36), and a
      # `kill -0 1` health proves process liveness, not bootstrap
      # completion (the grace-poll resident is "healthy" the whole
      # time it is blocked). The ordering safety comes from the
      # registrant's own retry loop, NOT this check: REGISTRAR_URL is
      # compose-internal http with a bounded 425-retry + a resident
      # grace poll (401/403/404) + supervisor restart on transient
      # network errors — the registrant-own service is safe to start
      # at any point in registrar's lifecycle. If the fleet later
      # wants hermes to wait on THIS service completing bootstrap,
      # make the marker itself the healthcheck (E2E overlay pattern:
      # test -f /data/agent/ready.marker) — healthy then MEANS the
      # chain completed.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    stop_signal: SIGTERM
    restart: always
  # ── f57.14 END ──────────────────────────────────────────────────────────────

  # ── j7g phase 1a (fleet-ops-6c2): the tailscale overlay service ─────────────
  # One private overlay network across the registrar (master) and
  # devices fleets, so the owner reaches the management layer (gateway
  # /ui, scotty queue UI, registrar console) from anywhere over the
  # tailnet, and VS devices may sit in DIFFERENT PHYSICAL LOCATIONS and
  # still bootstrap, communicate, and be coordinated by primus through
  # the master's endpoints. Per-device overlay (DECIDED, epic j7g): NO
  # subnet routes, NO exit node; the tailnet ACLs deny the funnel node
  # attribute for all VS tags — the overlay is reachable only from the
  # tailnet itself, and this service publishes nothing.
  #
  # lnf (j7g phase 2): the master's tailscale service is now a BUILD,
  # not the stock image — it SERVES the management layer at the
  # MagicDNS names (the caddy replacement). The baked serve-config.json
  # (Dockerfile.tailscale) carries the three fronted surfaces:
  # vector-sigma.tailb7207e.ts.net:443 -> 127.0.0.1:3000 (registrar),
  # :8443 -> 127.0.0.1:4000 (gateway), :8444 -> 127.0.0.1:3306
  # (scotty) — Let's Encrypt certs, auto-provisioned and renewed by
  # tailscaled once the tailnet has HTTPS enabled (admin-console
  # prerequisite, docs/tailscale-runbook.md). The DEVICES fleet's
  # tailscale service stays on the stock image (devices join; they
  # serve nothing) — the deliberate delta is pinned by
  # registrar/test/serve-edge.test.ts.
  #
  # Image: official tailscale/tailscale at a PINNED tag (never :latest;
  # arm64 manifest verified in the registry index 2026-10-01). Alpine-
  # based — the kill -0 1 healthcheck shell exists.
  # network_mode host: tailscaled manages the host netns (this is the
  # containerboot contract shape); no ports section is meaningful under
  # host networking and none is declared.
  #
  # NO ${VAR} substitution (supervisor compose): TS_AUTHKEY (per-device
  # auth key, pre-tagged tag:vs-master, reusable — owner-minted) arrives
  # as a balenaCloud SERVICE-scoped variable on the tailscale service
  # only (keeps the secret out of sibling containers), and TS_HOSTNAME
  # (the MagicDNS machine name, e.g. "vector-sigma") arrives as a
  # DEVICE-scoped variable — never hardcoded here. Both documented in
  # the README variable tables.
  #
  # ts-state volume: tailscaled identity persists across container
  # restarts — without it every restart mints a NEW tailnet node
  # (containerboot's TS_STATE_DIR contract). It now also carries the
  # LE certificates tailscaled provisions for the serve edge.
  #
  # /dev/net/tun passthrough (6c2 canary fix, 2026-10-01): balenaOS
  # containers do NOT inherit host /dev — the AC1 pre-flight proved the
  # node present on both live hosts (crw-rw-rw- 10,200, module builtin
  # to the 6.12.94-v8 balenaOS 8 kernel) yet the container on release
  # 4373489 still fell back to --tun=userspace-networking
  # (tstun: "error initializing tun dev stats polling: no such
  # device"), which cannot accept inbound tailnet traffic. The
  # passthrough is load-bearing, not belt-and-braces: containerboot's
  # own ensureTunFile mknod fallback requires CAP_MKNOD, which this
  # service deliberately does not grant. The kernel-modules feature
  # label stays for forward-proofing (a future host whose tun is
  # modular).
  #
  # TS_USERSPACE: "false" — containerboot at v1.102.5 defaults
  # UserspaceMode TRUE (cmd/containerboot/settings.go:111 —
  # def.Bool(os.Getenv("TS_USERSPACE"), true)); without this explicit
  # override the passthrough alone would still boot userspace. Kernel
  # tun is what accepts inbound tailnet connections.
  #
  # TS_BOOT_TIMEOUT: 24h — v1.102.5's default 60s boot deadline expires
  # the IPN-bus watch on a keyless NeedsLogin park (containerboot exits
  # 1, supervisor restarts — the ~61s loop pinned live on release
  # 4373489: 157 restarts on optimus-prime, 34 on the master). A long
  # deadline makes the keyless state a benign park instead: container
  # Running/healthy, unjoined, until the owner's TS_AUTHKEY lands —
  # the supervisor then recreates the container with the new env and
  # the join evidence starts. The variable is structural (not a
  # secret) and safe in compose.
  #
  # TS_SERVE_CONFIG (lnf): the baked serve config's in-container path
  # (supervisor fact 2 — this lane exercises the declarative serve
  # config under the supervisor). containerboot at v1.102.5 reads it
  # as a raw ipn.ServeConfig JSON file (verified from the pinned tag's
  # own source, cmd/containerboot/serve.go): TCP map keyed by port,
  # Web map keyed "SNI:port" (no implicit 443), handlers proxying the
  # loopback publishes. Application: containerboot UNSETS any prior
  # serve config at startup, then applies the file's contents on the
  # first netmap update and on every file change (fsnotify + 5s ticker
  # fallback). The apply is refused with a log line if the tailnet has
  # HTTPS certs disabled — the owner prerequisite.
  #
  # Healthcheck is process liveness only: join state (tailscale status
  # showing the tailnet IP) and serve state (the ts.net names answering)
  # are CANARY evidence, not healthcheck questions — same
  # marker-vs-liveness split as the rest of this app (the 1py.3 lesson:
  # a probe-based check can restart-loop a healthy container).
  tailscale:
    build:
      context: .
      dockerfile: Dockerfile.tailscale
    network_mode: host
    cap_add:
      - net_admin
      - net_raw
    devices:
      - /dev/net/tun
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_BOOT_TIMEOUT: "24h"
      TS_SERVE_CONFIG: /serve-config.json
    volumes:
      - ts-state:/var/lib/tailscale
    labels:
      io.balena.features.kernel-modules: "1"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    stop_signal: SIGTERM
    restart: always

volumes:
  pgdata:
  # j7g 6c2: tailscaled state (tailnet identity survives restarts; from
  # lnf/phase 2 it also carries the serve edge's Let's Encrypt certs).
  ts-state:
  # f57.15: the VS queue's Dolt state volume.
  doltdata:
  # f57.14: primus state — the shared agent-data volume pattern (the
  # registrant-own service writes the bundle + ready marker here; the
  # hermes service mounts it at /data/primus as HERMES_HOME).
  primus-data: