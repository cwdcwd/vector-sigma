# Vector Sigma registrar-fleet app — registrar + Postgres + the VS fleet's
# own LiteLLM gateway (f57.12) on balenaOS.
#
# Runs on the `registrar` balena fleet (1 device: Raspberry Pi 5,
# architecture aarch64). This compose is read by the balena supervisor
# (compose-file v2.4 semantics), NOT plain docker compose: no `${VAR}`
# substitution — every runtime value reaches services as a
# balenaCloud dashboard variable (service-scoped). See balena/registrar/README.md
# for the variable table.
#
# NOTE: the explicit `version: "2.4"` below is load-bearing — without it
# the balena CLI falls back to the legacy v1 schema and rejects every
# modern service key with "data/services should NOT have additional
# properties" (verified against the CLI's bundled ajv schema, v24.x).
version: "2.4"
#
# Cross-fleet reachability: each balena fleet is its own VPN — devices
# on the devices fleet CANNOT resolve this device over balena's
# internal network. The registrar therefore publishes on the device's
# LAN interfaces at the standard HTTP port: host 80 -> container 3000.
# Devices reach it via REGISTRAR_URL=http://<this-device-LAN-IP> (no
# port suffix — port 80 is implied); previously this documented :3000,
# which stopped being the published port in fleet-ops-f57.9. TLS remains
# out of scope (spec: off-LAN deployments TAGGED FOR LATER REVIEW) —
# the registrar sits on a trusted LAN only. The balenaCloud public-URL
# feature (device page -> PUBLIC URL toggle) tunnels to DEVICE port 80
# ONLY, which is why the host side of this publish is 80 and not an
# arbitrary high port.
#
# Secrets posture: no secrets in image layers or this file
# (fleet-ops-f57.8). POSTGRES_USER / POSTGRES_DB / DB_HOST /
# MIGRATE_ON_START ship here as static structural values; the owner sets
# only two secrets as balenaCloud dashboard variables: POSTGRES_PASSWORD
# (fleet-wide, so postgres and registrar see the same value) and
# SESSION_SECRET (registrar service). Dashboard variables override the
# static compose environment below.
#
# f57.12 gateway additions: LITELLM_MASTER_KEY, LITELLM_PG_PASSWORD and
# OLLAMA_CLOUD_API_KEY are owner-set balenaCloud FLEET variables (the bead's
# variable contract — fleet scope per the spec; service scope would be a
# hardening option, noted in the README). OLLAMA_CLOUD_API_BASE ships as a
# static structural value here (public endpoint, not a secret); override via
# dashboard variable only if Ollama Cloud's URL ever changes.
#
# f57.13 TLS edge: caddy fronts the composition (registrar :443, litellm
# :8443, https://TLS_HOSTNAME). Owner-set fleet variables: TLS_HOSTNAME (the
# Pi-hole record name, e.g. vsigma.lan), TLS_CERT_B64 + TLS_KEY_B64 (base64
# PEM pair from scripts/gen-vs-ca.sh output — single-line, dashboard-safe;
# never in image layers). The one-shot certs-init service decodes them into
# the caddy-certs volume; caddy waits for the pair then serves. Host ports
# 443/8443 publish to the device LAN; port 80 redirects to TLS. Device
# REGISTRAR_URL flips to https://<TLS_HOSTNAME> — see the README deploy-
# sequencing note (the f57.9 hazard class: flip AFTER the release lands).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Structural, non-secret (fleet-ops-f57.8): the role + database the
      # postgres image creates at first init of the data volume. The
      # registrar service carries the SAME values so the URL it builds
      # from parts cannot disagree with what postgres created.
      POSTGRES_USER: vsigma
      POSTGRES_DB: vsigma
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready only proves the server accepts connections — but it
      # prints "role does not exist" FATAL noise every 5s when
      # POSTGRES_USER is not literally "postgres" (auth happens after
      # the role lookup, and the FATAL lands in logs regardless of
      # pg_isready's exit code). Probe the role we actually create.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 24
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  registrar:
    build:
      context: ./registrar
      dockerfile: Dockerfile
    environment:
      # Structural (fleet-ops-f57.8): the registrar builds DATABASE_URL
      # from POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB/DB_HOST/DB_PORT
      # when DATABASE_URL is unset — the owner sets only POSTGRES_PASSWORD
      # (+ SESSION_SECRET) as balena variables. Same structural values as
      # the postgres service above so the built URL always agrees with
      # what postgres created.
      POSTGRES_USER: vsigma
      POSTGRES_DB: vsigma
      DB_HOST: postgres
      MIGRATE_ON_START: "true"
    # f57.13: no host publish — caddy fronts the registrar at
    # https://<TLS_HOSTNAME>:443 (host 80 belongs to caddy's redirect). The
    # container keeps listening on 3000; devices reach the admin console +
    # API via REGISTRAR_URL=https://<TLS_HOSTNAME> (TLS bootstrap). Compose-
    # internal access (deploy/ self-host example, E2E seed) uses
    # http://registrar:3000 inside the composition network.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  # f57.12: one-shot provisioning of the gateway's database (idempotent role
  # + database + least-privilege REVOKE; safe on the LIVE pgdata volume —
  # see README "The VS gateway (LiteLLM)"). The script ships in an image so
  # the balena supervisor and the deploy/ self-host compose run byte-identical
  # provisioning (the supervisor does no ${VAR} substitution). Uses the
  # POSTGRES_PASSWORD fleet var as the superuser credential and mints the
  # `litellm` role with the LITELLM_PG_PASSWORD fleet var — same parts the
  # litellm service's entrypoint assembles its DATABASE_URL from, so the URL
  # and the role can never disagree (the f57.8 trap, closed by construction).
  litellm-init:
    build:
      context: .
      dockerfile: Dockerfile.litellm-init
    environment:
      # Structural (mirror of the postgres service's role/db — the superuser
      # this script connects as). Secrets arrive as fleet variables:
      # POSTGRES_PASSWORD + LITELLM_PG_PASSWORD (no static values here).
      PGHOST: postgres
      PGUSER: vsigma
      PGDATABASE: vsigma
    depends_on:
      - postgres
    restart: "no"

  # f57.12: the VS fleet's own LiteLLM gateway — models front door + virtual
  # keys + the /a2a/* mesh for VS devices. Same image the deploy/ self-host
  # example builds (config baked by Dockerfile.litellm — the supervisor
  # cannot bind-mount). f57.13 (Copilot review): NO port publish — caddy
  # fronts the gateway at https://<TLS_HOSTNAME>:8443; devices point
  # GATEWAY_URL / A2A_PUBLIC_URL at https://<TLS_HOSTNAME>:8443. PROXY_BASE_URL
  # stays unset (cards advertise from the request Host header — now the
  # TLS_HOSTNAME the edge carries; the README documents the override).
  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    environment:
      # Structural parts (the entrypoint assembles DATABASE_URL; password
      # arrives as the LITELLM_PG_PASSWORD fleet variable).
      LITELLM_PG_USER: litellm
      LITELLM_PG_HOST: postgres
      LITELLM_PG_PORT: "5432"
      LITELLM_PG_DB: litellm
      # Public structural endpoint (not a secret); owner-set fleet vars:
      # LITELLM_MASTER_KEY, LITELLM_PG_PASSWORD, OLLAMA_CLOUD_API_KEY,
      # OLLAMA_CLOUD_API_BASE (structural https://ollama.com/v1).
    healthcheck:
      # Process liveness — parity with the registrar service's healthcheck
      # shape (the litellm image ships no curl/wget; /health/liveliness is
      # asserted externally by the deploy E2E smoke through the TLS edge).
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  # f57.13: one-shot TLS material provisioning — decodes the TLS_CERT_B64 /
  # TLS_KEY_B64 fleet variables into the shared caddy-certs volume (PEM
  # pair). Image-carried script (the litellm-init pattern): identical bytes
  # on balena (supervisor injects the fleet vars as env) and in deploy/
  # self-host (${VAR} interpolation). Fail-loud on missing/truncated values;
  # idempotent + rotation-safe (rewrites the pair every run — rotating the
  # leaf = update the two fleet vars + restart this service and caddy).
  certs-init:
    build:
      context: .
      dockerfile: Dockerfile.certs-init
    environment:
      # Secrets arrive as fleet variables: TLS_CERT_B64 + TLS_KEY_B64 (no
      # static values here). CERTS_DIR is structural.
      CERTS_DIR: /certs
    volumes:
      - caddy-certs:/certs
    restart: "no"

  # f57.13: the TLS edge — caddy fronts the whole composition per the baked
  # Caddyfile (registrar :443, litellm :8443, 80 -> 308 redirect). TLS_HOSTNAME
  # is a fleet variable consumed by caddy's own {$VAR:default} substitution
  # (the supervisor does no interpolation; the Caddyfile stays identical in
  # deploy/ self-host). The entrypoint shim waits for the certs-init pair so
  # the concurrent start order can never fail caddy fast.
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    environment:
      # Structural (Caddyfile {$TLS_HOSTNAME:vsigma.lan} default mirrors it;
      # the fleet var wins when set).
      TLS_HOSTNAME: vsigma.lan
    ports:
      # The composition's TLS front door. 443 = registrar (admin + API);
      # 8443 = the VS gateway (gateway + /ui + /a2a/*). Port 80 serves only
      # the 308 redirect to https.
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - caddy-certs:/certs
    depends_on:
      - certs-init
    healthcheck:
      # Real TLS readiness (Copilot f57.13 review): the entrypoint is still
      # PID 1 while waiting for certs, so process liveness would report a
      # "healthy" edge before any cert exists. Probe the actual front door
      # instead — the supervisor's rollout/monitoring then reports the edge
      # healthy only when it actually serves TLS. caddy:2-alpine ships curl;
      # --insecure because THIS check is about the server having a usable
      # pair loaded, not about the client trusting the CA.
      test: ["CMD-SHELL", "curl -fsk --resolve {$TLS_HOSTNAME:vsigma.lan}:443:127.0.0.1 https://{$TLS_HOSTNAME:vsigma.lan}/healthz -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

volumes:
  pgdata:
  caddy-certs: