# Vector Sigma registrar-fleet app — registrar + Postgres + the VS fleet's
# own LiteLLM gateway (f57.12) on balenaOS.
#
# Runs on the `registrar` balena fleet (1 device: Raspberry Pi 5,
# architecture aarch64). This compose is read by the balena supervisor
# (compose-file v2.4 semantics), NOT plain docker compose: no `${VAR}`
# substitution — every runtime value reaches services as a
# balenaCloud dashboard variable (service-scoped). See balena/registrar/README.md
# for the variable table.
#
# NOTE: the explicit `version: "2.4"` below is load-bearing — without it
# the balena CLI falls back to the legacy v1 schema and rejects every
# modern service key with "data/services should NOT have additional
# properties" (verified against the CLI's bundled ajv schema, v24.x).
version: "2.4"
#
# Cross-fleet reachability: each balena fleet is its own VPN — devices
# on the devices fleet CANNOT resolve this device over balena's
# internal network. The registrar therefore publishes on the device's
# LAN interfaces at the standard HTTP port: host 80 -> container 3000.
# Devices reach it via REGISTRAR_URL=http://<this-device-LAN-IP> (no
# port suffix — port 80 is implied); previously this documented :3000,
# which stopped being the published port in fleet-ops-f57.9. TLS remains
# out of scope (spec: off-LAN deployments TAGGED FOR LATER REVIEW) —
# the registrar sits on a trusted LAN only. The balenaCloud public-URL
# feature (device page -> PUBLIC URL toggle) tunnels to DEVICE port 80
# ONLY, which is why the host side of this publish is 80 and not an
# arbitrary high port.
#
# Secrets posture: no secrets in image layers or this file
# (fleet-ops-f57.8). POSTGRES_USER / POSTGRES_DB / DB_HOST /
# MIGRATE_ON_START ship here as static structural values; the owner sets
# only two secrets as balenaCloud dashboard variables: POSTGRES_PASSWORD
# (fleet-wide, so postgres and registrar see the same value) and
# SESSION_SECRET (registrar service). Dashboard variables override the
# static compose environment below.
#
# f57.12 gateway additions: LITELLM_MASTER_KEY, LITELLM_PG_PASSWORD and
# OLLAMA_CLOUD_API_KEY are owner-set balenaCloud FLEET variables (the bead's
# variable contract — fleet scope per the spec; service scope would be a
# hardening option, noted in the README). OLLAMA_CLOUD_API_BASE ships as a
# static structural value here (public endpoint, not a secret); override via
# dashboard variable only if Ollama Cloud's URL ever changes.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Structural, non-secret (fleet-ops-f57.8): the role + database the
      # postgres image creates at first init of the data volume. The
      # registrar service carries the SAME values so the URL it builds
      # from parts cannot disagree with what postgres created.
      POSTGRES_USER: vsigma
      POSTGRES_DB: vsigma
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready only proves the server accepts connections — but it
      # prints "role does not exist" FATAL noise every 5s when
      # POSTGRES_USER is not literally "postgres" (auth happens after
      # the role lookup, and the FATAL lands in logs regardless of
      # pg_isready's exit code). Probe the role we actually create.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 24
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  registrar:
    build:
      context: ./registrar
      dockerfile: Dockerfile
    environment:
      # Structural (fleet-ops-f57.8): the registrar builds DATABASE_URL
      # from POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB/DB_HOST/DB_PORT
      # when DATABASE_URL is unset — the owner sets only POSTGRES_PASSWORD
      # (+ SESSION_SECRET) as balena variables. Same structural values as
      # the postgres service above so the built URL always agrees with
      # what postgres created.
      POSTGRES_USER: vsigma
      POSTGRES_DB: vsigma
      DB_HOST: postgres
      MIGRATE_ON_START: "true"
    ports:
      # Host 80 -> container 3000 (fleet-ops-f57.9): the container keeps
      # listening on 3000 (PORT env unchanged); the balenaCloud public-URL
      # feature tunnels to DEVICE port 80 only, so 80 is the host side.
      - "80:3000"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  # f57.12: one-shot provisioning of the gateway's database (idempotent role
  # + database + least-privilege REVOKE; safe on the LIVE pgdata volume —
  # see README "The VS gateway (LiteLLM)"). The script ships in an image so
  # the balena supervisor and the deploy/ self-host compose run byte-identical
  # provisioning (the supervisor does no ${VAR} substitution). Uses the
  # POSTGRES_PASSWORD fleet var as the superuser credential and mints the
  # `litellm` role with the LITELLM_PG_PASSWORD fleet var — same parts the
  # litellm service's entrypoint assembles its DATABASE_URL from, so the URL
  # and the role can never disagree (the f57.8 trap, closed by construction).
  litellm-init:
    build:
      context: .
      dockerfile: Dockerfile.litellm-init
    environment:
      # Structural (mirror of the postgres service's role/db — the superuser
      # this script connects as). Secrets arrive as fleet variables:
      # POSTGRES_PASSWORD + LITELLM_PG_PASSWORD (no static values here).
      PGHOST: postgres
      PGUSER: vsigma
      PGDATABASE: vsigma
    depends_on:
      - postgres
    restart: "no"

  # f57.12: the VS fleet's own LiteLLM gateway — models front door + virtual
  # keys + the /a2a/* mesh for VS devices. Same image the deploy/ self-host
  # example builds (config baked by Dockerfile.litellm — the supervisor
  # cannot bind-mount). Port 4000 published to the device LAN per the AC;
  # devices point GATEWAY_URL / A2A_PUBLIC_URL at http://<device-LAN-IP>:4000.
  # No reverse proxy in this topology → PROXY_BASE_URL unset is CORRECT (cards
  # advertise from the request Host header = the master's LAN IP); the README
  # documents it as an optional dashboard override for future proxy fronting.
  litellm:
    build:
      context: .
      dockerfile: Dockerfile.litellm
    environment:
      # Structural parts (the entrypoint assembles DATABASE_URL; password
      # arrives as the LITELLM_PG_PASSWORD fleet variable).
      LITELLM_PG_USER: litellm
      LITELLM_PG_HOST: postgres
      LITELLM_PG_PORT: "5432"
      LITELLM_PG_DB: litellm
      # Public structural endpoint (not a secret); owner-set fleet vars:
      # LITELLM_MASTER_KEY, LITELLM_PG_PASSWORD, OLLAMA_CLOUD_API_KEY.
      OLLAMA_CLOUD_API_BASE: https://ollama.com/v1
    ports:
      - "4000:4000"
    healthcheck:
      # Process liveness — parity with the registrar service's healthcheck
      # shape (the litellm image ships no curl/wget; /health/liveliness is
      # asserted externally by the deploy E2E smoke).
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  # ── f57.15 BEGIN: the VS fleet's own queue plane (dolt + scotty) ────────────
  # Provenance: mirrors the Cabal's central-Dolt + Scotty stack (fleet proven:
  # central Dolt :3326, scotty v0.3.0 cc55734 + the 8ea deep-link patch, bd
  # pinned at 1.2.2, BD_BIN read-only wrapper + SCOTTY_READ_ONLY=1 two-layer
  # posture). Owner ruling: VS queue is fully self-contained — VS devices run
  # bd clients against THIS dolt; cross-fleet coordination (primus <->
  # ultronbot) is A2A only, never shared-queue writes.
  dolt:
    image: dolthub/dolt-sql-server:2.3.5
    environment:
      # Structural (public values): the database VS bd clients join. Secrets
      # are balenaCloud fleet variables ONLY (f57.8 pattern — they do not
      # appear in this file at all, not even as empty stubs): DOLT_PASSWORD
      # (the VS queue's Dolt auth — owner-minted, 600-equivalent custody,
      # never in image layers) + DOLT_ROOT_PASSWORD (superuser; the image
      # needs it to create the app user, and root stays localhost-only by
      # image default — the queue never logs in as root over the LAN).
      DOLT_DATABASE: vs_ops
      DOLT_USER: vs
      DOLT_USER_HOST: "%"
    volumes:
      - doltdata:/var/lib/dolt
    ports:
      # Published to the device LAN: VS device bd clients reach the master
      # over the LAN exactly like REGISTRAR_URL (owner ruling: devices run bd
      # clients against it). Not reachable off-LAN: the balenaCloud public-URL
      # feature tunnels device port 80 ONLY (f57.9). Cabal precedent: central
      # Dolt :3326 serving every fleet client.
      - "3326:3306"
    healthcheck:
      # Dolt's documented liveness query, AUTHENTICATED, with the client
      # flags in the right position: dolt's connection flags are GLOBAL flags
      # — they must PRECEDE the subcommand (`dolt --host ... sql -q ...`);
      # placed after `sql` the CLI rejects them ("unknown option `host'",
      # proven live against dolt 2.3.5 — CI run-3's red). And the probe
      # must authenticate as the app user: once DOLT_ROOT_PASSWORD is set,
      # a root probe without a password is Access-denied (dolthub issue
      # #7428's symptom — CI run-2's red). The entrypoint creates
      # DOLT_USER/DOLT_PASSWORD before serving; the in-container shell
      # expands the password from the fleet variable at probe time (the
      # supervisor does no interpolation). Fail-closed: a missing fleet
      # variable fails the healthcheck rather than probing blind.
      test: ["CMD-SHELL", "dolt --host 127.0.0.1 --port 3306 --no-tls -u vs -p \"$DOLT_PASSWORD\" sql -q 'select current_timestamp();'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  scotty:
    build:
      context: .
      dockerfile: Dockerfile.scotty
    environment:
      # Two-layer read-only posture (Cabal runbook, fleet-ops-8ea):
      #   layer 1: SCOTTY_READ_ONLY=1 — scotty refuses project writes
      #   layer 2: BD_BIN wrapper (baked into the image; see bd-readonly)
      SCOTTY_READ_ONLY: "1"
      # BEADS_REPO must point at a .beads workspace. On the master device the
      # queue lives in the dolt container; scotty's bd bridge shells out to the
      # IN-IMAGE bd (wrapped read-only), which connects to the dolt service
      # over the compose network. The workspace it reads is a join-config
      # directory baked alongside (queue-join/), so no bind mount exists to
      # drift — balena supervisor allows none anyway (f57.12 precedent).
      BEADS_REPO: /queue-join
      # Dolt connection for the in-image bd (server mode): host = the compose
      # service name; the password arrives as the BEADS_DOLT_PASSWORD service
      # variable (same secret value as the dolt service's DOLT_PASSWORD — one
      # owner-minted secret, two variable names because bd and the dolt image
      # read different env keys). NEVER baked into the image (f57.8).
    depends_on:
      - dolt
    ports:
      # LAN dashboard (the queue UI): devices/owner reach it at
      # http://<master-LAN-IP>:3306 — the Cabal dashboard's port posture.
      - "3306:3306"
    healthcheck:
      # HTTP liveness: scotty serves /api/projects (the project picker's data
      # route — verified present at cc55734; there is no /api/doctor route)
      # once Next is up. bd errors surface as 5xx on project routes, so this
      # also catches a wedged bd bridge.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3306/api/projects').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always
  # ── f57.15 END ──────────────────────────────────────────────────────────────

volumes:
  pgdata:
  # f57.15: the VS queue's Dolt state volume.
  doltdata: