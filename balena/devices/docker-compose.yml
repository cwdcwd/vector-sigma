# Vector Sigma devices-fleet app — agent + registrant on balenaOS.
#
# Runs on the `devices` balena fleet (3–4 Raspberry Pi 5 devices,
# architecture aarch64). This compose is read by the balena supervisor
# (compose-file v2.4 semantics), NOT plain docker compose: no `${VAR}`
# substitution is performed — every runtime value reaches services as a
# balenaCloud dashboard variable (device or fleet scope). See
# balena/devices/README.md and docs/balena-devices-runbook.md.
#
# NOTE: the explicit `version: "2.4"` below is load-bearing — without it
# the balena CLI falls back to the legacy v1 schema and rejects every
# modern service key with "data/services should NOT have additional
# properties" (verified against the CLI's bundled ajv schema, v24.x).
version: "2.4"
#
# No secrets in image layers, build args, or this file. The per-device
# REGISTRAR_KEY is a device-scoped balena variable; BALENA_DEVICE_UUID is
# injected by the platform automatically.

services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    # The image's gate.sh entrypoint blocks on /data/agent/ready.marker
    # before exec'ing this command as the agent runtime.
    command:
      - node
      - -e
      - |
        console.log('[agent] identity verified — agent runtime placeholder active');
        process.title = 'vector-sigma-agent';
        setInterval(() => {
          console.log('[agent] heartbeat');
        }, 30000);
    volumes:
      - agent-data:/data/agent
    # Identity gate: no ready marker => the agent never starts. The
    # supervisor auto-restarts containers on exit (restart defaults to
    # always under balena); this healthcheck is process liveness to
    # catch alive-but-broken containers and exec-architecture failures.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  registrant:
    build:
      context: ./registrant
      dockerfile: Dockerfile
    volumes:
      - agent-data:/data/agent
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    stop_signal: SIGTERM
    restart: always

volumes:
  agent-data: