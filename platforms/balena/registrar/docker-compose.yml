# GENERATED by scripts/render-stack.mjs from stack/registrar.yaml — do not edit.
# Change the spec, then run: node scripts/render-stack.mjs

# Vector Sigma registrar-fleet app — registrar + Postgres + the VS fleet's
# own LiteLLM gateway (f57.12) on balenaOS.
#
# Runs on the `registrar` balena fleet (1 device: Raspberry Pi 5,
# architecture aarch64). This compose is read by the balena supervisor
# (compose-file v2.4 semantics), NOT plain docker compose: no `${VAR}`
# substitution — every runtime value reaches services as a
# balenaCloud dashboard variable (service-scoped). See
# platforms/balena/registrar/README.md for the variable table.
#
# NOTE: the explicit `version: "2.4"` below is load-bearing — without it
# the balena CLI falls back to the legacy v1 schema and rejects every
# modern service key with "data/services should NOT have additional
# properties" (verified against the CLI's bundled ajv schema, v24.x).
#
# Images: every VS-built service's `build:` block (context: the repo root)
# is the INPUT to scripts/render-release-compose.mjs, which a `registrar-v*`
# release runs to swap each block for the CI-built GHCR image pinned by
# digest (images.json; .github/workflows/_images.yml). `balena push` /
# `balena deploy --build` against THIS file is NOT a supported path: the
# balena CLI confines build contexts to the project dir and rejects
# ../../.. Release only by pushing a `registrar-v*` tag.
#
# Secrets posture: no secrets in image layers or this file (fleet-ops-f57.8).
# Structural values ship here; the owner sets secrets as balenaCloud
# dashboard variables (POSTGRES_PASSWORD fleet-wide so postgres and
# registrar agree; SESSION_SECRET on registrar; LITELLM_MASTER_KEY,
# LITELLM_PG_PASSWORD and OLLAMA_CLOUD_API_KEY as fleet variables; the
# queue's DOLT_PASSWORD / DOLT_ROOT_PASSWORD / BEADS_DOLT_PASSWORD). Dashboard
# variables override the static compose environment below.
#
# lnf (j7g phase 2) — the serve-only edge: the tailscale service's serve
# config fronts the three management surfaces at the MagicDNS names with
# Let's Encrypt certificates; every service publishes on 127.0.0.1 loopback
# ONLY. See docs/tailscale-runbook.md (phase 2) and docs/tls-runbook.md.

version: "2.4"
services:
  postgres:
    build:
      context: ../../..
      dockerfile: images/postgres/Dockerfile
    environment:
      # Structural, non-secret (fleet-ops-f57.8): the role + database the
      # postgres image creates at first init of the data volume. The
      # registrar carries the SAME values so the URL it builds from parts
      # cannot disagree with what postgres created.
      POSTGRES_USER: vsigma
      POSTGRES_DB: vsigma
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Probe the role we actually create: pg_isready against the default
      # role prints "role does not exist" FATAL noise every 5s.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 24
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  registrar:
    build:
      context: ../../..
      dockerfile: registrar/Dockerfile
    environment:
      MIGRATE_ON_START: "true"
      # Structural (fleet-ops-f57.8): the registrar builds DATABASE_URL
      # from POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB/DB_HOST when
      # DATABASE_URL is unset — the owner sets only POSTGRES_PASSWORD
      # (+ SESSION_SECRET) as balena variables.
      POSTGRES_USER: vsigma
      POSTGRES_DB: vsigma
      DB_HOST: postgres
    # lnf (j7g phase 2): 127.0.0.1-ONLY host publish. tailscaled runs in
    # the host network namespace and cannot reach compose-network names,
    # so the serve edge proxies at the loopback publish (registrar at the
    # MagicDNS name :443 -> http://127.0.0.1:3000). Compose-internal access
    # (E2E seed, registrant-own) keeps using http://registrar:3000.
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  # f57.12 (consolidated fleet-ops-anc, 2026-09-29): the VS fleet's own
  # LiteLLM gateway — models front door + virtual keys + the /a2a/* mesh for
  # VS devices (config baked by images/litellm/Dockerfile — the supervisor
  # cannot bind-mount). The entrypoint assembles DATABASE_URL from the parts
  # below and retry-cycles its DB connection; the role + database come from
  # the postgres wrapper.
  litellm:
    build:
      context: ../../..
      dockerfile: images/litellm/Dockerfile
    environment:
      LITELLM_PG_USER: litellm
      LITELLM_PG_HOST: postgres
      LITELLM_PG_PORT: "5432"
      LITELLM_PG_DB: litellm
      # Public structural endpoint, not a secret (its absence was once the
      # live root cause of the gateway completing against api.openai.com).
      OLLAMA_CLOUD_API_BASE: https://ollama.com/v1
    # lnf (j7g phase 2): 127.0.0.1-ONLY publish; the serve edge fronts the
    # gateway at the MagicDNS name :8443 (any TLS proxy self-host).
    # PROXY_BASE_URL stays unset: cards advertise from the request Host.
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      # Process liveness (the litellm image ships no curl/wget).
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    # lfk (the live AC3 Defect A fix): static hosts pins for the A2A
    # proxy's dial role. The proxy follows a registered agent's origin
    # card and dials the ADVERTISED url — the master's own MagicDNS name
    # and each enrolled device's serve name. The container DNS chain
    # (127.0.0.11 -> host dnsmasq -> upstream) has NO ts.net route, so
    # every dial died gaierror until these pins.
    #
    # SCALING CONTRACT: extra_hosts has NO substitution path under the
    # supervisor compose, so ONE LINE PER ENROLLED DEVICE IS THE
    # MECHANISM — each newly enrolled device = one line here (in
    # stack/registrar.yaml, then render) + a master redeploy. The line's
    # IP is the device's TAILNET IP (deterministic — ts-state persists
    # node identity). Currently enrolled: optimus-prime.
    extra_hosts:
      - "vector-sigma.tailb7207e.ts.net:100.124.197.78"
      - "optimus-prime.tailb7207e.ts.net:100.99.56.18"
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  # ── f57.15: the VS fleet's own queue plane (dolt + scotty) ────────────────
  # Mirrors the origin fleet's central-Dolt + Scotty stack (central Dolt
  # :3326, scotty v0.3.0 cc55734 + the 8ea deep-link patch, bd pinned at
  # 1.2.2, BD_BIN read-only wrapper + SCOTTY_READ_ONLY=1). Owner ruling: the
  # VS queue is fully self-contained; cross-fleet coordination is A2A only.
  dolt:
    image: dolthub/dolt-sql-server:2.3.5
    environment:
      DOLT_DATABASE: vs_ops
      DOLT_USER: vs
      DOLT_USER_HOST: "%"
    volumes:
      - doltdata:/var/lib/dolt
    ports:
      # Loopback-only per gateway hardening (#89): no database port on the
      # LAN. Device bd clients reach the queue over the TAILNET :3326 — the
      # balena serve edge forwards it as raw TCP to this publish.
      - "127.0.0.1:3326:3306"
    healthcheck:
      # Dolt's liveness query, AUTHENTICATED as the app user, with the
      # client flags as GLOBAL flags BEFORE the sql subcommand (the CLI
      # rejects them after it — proven live against dolt 2.3.5). The
      # password expands in the container's shell at probe time from the
      # service's own environment; a missing variable fails the check.
      test: ["CMD-SHELL", "dolt --host 127.0.0.1 --port 3306 --no-tls -u vs -p \"$DOLT_PASSWORD\" sql -q 'select current_timestamp();'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  scotty:
    build:
      context: ../../..
      dockerfile: images/scotty/Dockerfile
    environment:
      # Two-layer read-only posture (fleet-ops-8ea): SCOTTY_READ_ONLY=1, plus
      # the BD_BIN wrapper baked into the image (images/scotty/bd-readonly).
      SCOTTY_READ_ONLY: "1"
      # The .beads join-config workspace baked into the image; the in-image
      # bd reaches the dolt service over the compose network.
      BEADS_REPO: /queue-join
    depends_on:
      - dolt
    # lnf (j7g phase 2): 127.0.0.1-ONLY publish — the serve edge fronts
    # scotty at the MagicDNS name :8444. Its lock is the tailnet ACL tag +
    # TLS identity alone.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # HTTP liveness on /api/projects; bd errors surface as 5xx there, so
      # this also catches a wedged bd bridge.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3306/api/projects').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  # ── f57.14: primus — the VS coordinator Hermes, self-bootstrapped ─────────
  # The dogfood proof: the master's own agent bootstraps through the SAME
  # chain every device uses — registrant-own fetches the owner-prepared
  # primus bundle from the registrar and applies it to the shared
  # primus-data volume. The official Hermes image has no marker gate
  # (f57.20); the marker-gap race is closed by the image's first-boot-only
  # seed + restart.
  hermes:
    # b1r: the pinned official Hermes image + bd 1.2.2 baked FULL READ-WRITE
    # (primus is the queue CURATOR) + the queue join + the environment docs
    # + the boot hooks. Fully rebuildable from the repo with zero manual steps.
    build:
      context: ../../..
      dockerfile: images/hermes/Dockerfile
    # The image's CMD default is a bare REPL that exits on EOF; the upstream
    # reference compose's long-run form is `gateway run`.
    command: ["gateway", "run"]
    environment:
      HERMES_HOME: /data/primus
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      # Read the registrant-written (uid 1000) bundle: the image's HERMES_UID
      # remap (uid 10000 cannot read the 0600 files otherwise).
      HERMES_UID: "1000"
      HERMES_GID: "1000"
    volumes:
      - primus-data:/data/primus
    depends_on:
      - registrant-own
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    # j7g phase 1b (fleet-ops-lrb): static hosts pin for the master's OWN
    # MagicDNS FQDN — primus's GATEWAY_URL / A2A_PUBLIC_URL point there and
    # the container DNS chain has no ts.net route. Same literal pair as
    # the devices compose pins (docs/tailscale-runbook.md).
    extra_hosts:
      - "vector-sigma.tailb7207e.ts.net:100.124.197.78"
    stop_grace_period: 60s
    stop_signal: SIGTERM
    restart: always

  # f57.14: the master's OWN registrant (the same image every device runs).
  # Polls the compose-internal registrar and applies the primus bundle to
  # primus-data, writing /data/primus/ready.marker last.
  registrant-own:
    build:
      context: ../../..
      dockerfile: registrant/Dockerfile
    environment:
      REGISTRAR_URL: http://registrar:3000
    volumes:
      - primus-data:/data/agent
    depends_on:
      - registrar
    healthcheck:
      # Process liveness only. Under the supervisor this never gated hermes
      # (no depends_on conditions); ordering safety is the registrant's own
      # retry loop + grace poll.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    stop_signal: SIGTERM
    restart: always

  # ── j7g (6c2 + lnf): the tailscale overlay + serve edge (balena only) ────
  # One private overlay across the master and devices fleets; NO subnet
  # routes, NO exit node, funnel denied by ACL. The master's tailscale SERVES
  # the management layer at the MagicDNS names from the baked
  # images/tailscale/serve-config.json (registrar :443, gateway :8443,
  # scotty :8444, raw TCP :3326 to dolt). Self-host brings its own edge.
  #
  # TS_AUTHKEY (service variable) and TS_HOSTNAME (device variable) are
  # never in this file. ts-state persists tailnet identity + LE certs.
  # /dev/net/tun passthrough + TS_USERSPACE "false" are load-bearing
  # (containerboot v1.102.5 defaults to userspace, which cannot accept
  # inbound tailnet traffic). TS_BOOT_TIMEOUT 24h makes a keyless
  # NeedsLogin a benign park instead of a 61s restart loop. Healthcheck is
  # process liveness only (the 1py.3 lesson).
  tailscale:
    build:
      context: ../../..
      dockerfile: images/tailscale/Dockerfile
    network_mode: host
    cap_add:
      - net_admin
      - net_raw
    devices:
      - /dev/net/tun
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_BOOT_TIMEOUT: "24h"
      TS_SERVE_CONFIG: /serve-config.json
    volumes:
      - ts-state:/var/lib/tailscale
    labels:
      io.balena.features.kernel-modules: "1"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    stop_signal: SIGTERM
    restart: always

# Volumes: pgdata (postgres), doltdata (f57.15: the VS queue's Dolt state),
# primus-data (f57.14: primus state — bundle + ready marker from
# registrant-own; the hermes service's HERMES_HOME).
volumes:
  pgdata:
  doltdata:
  primus-data:
  # j7g 6c2: tailscaled state (tailnet identity survives restarts; from
  # lnf/phase 2 it also carries the serve edge's Let's Encrypt certs).
  ts-state:

