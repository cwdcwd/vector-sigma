# GENERATED by scripts/render-stack.mjs from stack/registrar.yaml — do not edit.
# Change the spec, then run: node scripts/render-stack.mjs

# Vector Sigma — self-host on any Docker host.
#
# Quickstart (see platforms/compose/README.md):
#   cp platforms/compose/.env.example platforms/compose/.env   # edit: set real secrets + VS_IMAGE_TAG
#   docker compose -f platforms/compose/compose.yaml up -d
#   curl http://127.0.0.1:3000/healthz   # loopback publish (lnf phase 2)
#
# Images: every VS-built service runs the SAME GHCR image the balena fleets
# run — CI builds each images.json component once, scans it, E2Es those
# bytes and promotes them, tagged with the commit SHA. VS_IMAGE_TAG pins
# that SHA (no floating tag exists); VS_IMAGE_REGISTRY points at a mirror.
# Nothing here builds from source (test/e2e/compose.e2e.yaml does, for CI).
#
# Interpolation is fail-closed: every ${VAR:?} aborts `compose config` when
# platforms/compose/.env does not define it — no silent defaults for secrets.
#
# Every service publishes on 127.0.0.1 loopback ONLY. On the balena master
# the tailscale serve edge fronts them at the MagicDNS names; here an
# operator puts their own TLS edge in front of the loopback publishes (any
# proxy — the README documents the pattern).

services:
  postgres:
    image: ${VS_IMAGE_REGISTRY:-ghcr.io/cwdcwd/vector-sigma}/postgres:${VS_IMAGE_TAG:?set in platforms/compose/.env — the commit SHA of a published build}
    environment:
      # Self-host names its own role + database (.env).
      POSTGRES_USER: ${POSTGRES_USER:?set in platforms/compose/.env}
      POSTGRES_DB: ${POSTGRES_DB:?set in platforms/compose/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in platforms/compose/.env}
      # Superuser credential for the wrapper's provisioning psql.
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in platforms/compose/.env}
      # Password for the gateway's `litellm` role the wrapper mints.
      LITELLM_PG_PASSWORD: ${LITELLM_PG_PASSWORD:?set in platforms/compose/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Probe the role + database we actually create: pg_isready against the
      # defaults prints "role does not exist" FATAL noise every 5s. `$$`
      # defers expansion to the in-container shell on BOTH platforms: docker
      # compose and `balena deploy` (compose-go) interpolate a single `$` at
      # deploy time from the deployer's environment — on the release runner
      # that is empty (compose-dialect.test.ts).
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 24
    stop_grace_period: 60s
    restart: unless-stopped

  registrar:
    image: ${VS_IMAGE_REGISTRY:-ghcr.io/cwdcwd/vector-sigma}/registrar:${VS_IMAGE_TAG:?set in platforms/compose/.env — the commit SHA of a published build}
    environment:
      MIGRATE_ON_START: "true"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "3000"
      SESSION_SECRET: ${SESSION_SECRET:?set in platforms/compose/.env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # j7g.1 mesh-enroll + e5o.3 memory-key mint: the registrar's gateway
      # client config. GATEWAY_KEY_MINT_BASE_URL is STRUCTURAL (the
      # compose-internal gateway address). LITELLM_MASTER_KEY reaches the
      # registrar ONLY for the one-time creator-key bootstrap (see
      # docs/gateway-ops.md). On balena these arrive via fleet-variable
      # cascade and the documented e5o.3 service variable; plain compose
      # has no cascade, so both are explicit.
      GATEWAY_KEY_MINT_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in platforms/compose/.env}
    # lnf (j7g phase 2): 127.0.0.1-ONLY host publish. tailscaled runs in
    # the host network namespace and cannot reach compose-network names,
    # so the serve edge proxies at the loopback publish (registrar at the
    # MagicDNS name :443 -> http://127.0.0.1:3000). Compose-internal access
    # (E2E seed, registrant-own) keeps using http://registrar:3000.
    ports:
      - "127.0.0.1:3000:3000"
    # Starts after postgres. Compose waits for it to be healthy; balena's
    # supervisor honours start order only (its builder rejects conditions)
    # and the registrar's own DB connect retries cover the gap.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Readiness, not just liveness: /healthz answers once the registrar
      # serves. Exec form (no shell, no $) so it is identical in both compose
      # dialects. ~2 minutes of failures (24 x 5s) before unhealthy covers a
      # slow MIGRATE_ON_START on first boot.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    stop_grace_period: 60s
    restart: unless-stopped

  # f57.12 (consolidated fleet-ops-anc, 2026-09-29): the VS fleet's own
  # LiteLLM gateway — models front door + virtual keys + the /a2a/* mesh for
  # VS devices (config baked by images/litellm/Dockerfile — the supervisor
  # cannot bind-mount). The entrypoint assembles DATABASE_URL from the parts
  # below and retry-cycles its DB connection; the role + database come from
  # the postgres wrapper.
  litellm:
    image: ${VS_IMAGE_REGISTRY:-ghcr.io/cwdcwd/vector-sigma}/litellm:${VS_IMAGE_TAG:?set in platforms/compose/.env — the commit SHA of a published build}
    environment:
      LITELLM_PG_USER: litellm
      LITELLM_PG_HOST: postgres
      LITELLM_PG_PORT: "5432"
      LITELLM_PG_DB: litellm
      # Public structural endpoint, not a secret (its absence was once the
      # live root cause of the gateway completing against api.openai.com).
      OLLAMA_CLOUD_API_BASE: ${OLLAMA_CLOUD_API_BASE:-https://ollama.com/v1}
      LITELLM_PG_PASSWORD: ${LITELLM_PG_PASSWORD:?set in platforms/compose/.env}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in platforms/compose/.env}
      OLLAMA_CLOUD_API_KEY: ${OLLAMA_CLOUD_API_KEY:?set in platforms/compose/.env}
    # lnf (j7g phase 2): 127.0.0.1-ONLY publish; the serve edge fronts the
    # gateway at the MagicDNS name :8443 (any TLS proxy self-host).
    # PROXY_BASE_URL stays unset: cards advertise from the request Host.
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Process liveness (the litellm image ships no curl/wget).
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 60s
    restart: unless-stopped

  # ── f57.15: the VS fleet's own queue plane (dolt + scotty) ────────────────
  # Mirrors the origin fleet's central-Dolt + Scotty stack (central Dolt
  # :3326, scotty v0.3.0 cc55734 + the 8ea deep-link patch, bd pinned at
  # 1.2.2, BD_BIN read-only wrapper + SCOTTY_READ_ONLY=1). Owner ruling: the
  # VS queue is fully self-contained; cross-fleet coordination is A2A only.
  dolt:
    image: dolthub/dolt-sql-server:2.3.5
    environment:
      DOLT_DATABASE: vs_ops
      DOLT_USER: vs
      DOLT_USER_HOST: "%"
      DOLT_PASSWORD: ${DOLT_PASSWORD:?set in platforms/compose/.env}
      DOLT_ROOT_PASSWORD: ${DOLT_ROOT_PASSWORD:?set in platforms/compose/.env}
    volumes:
      - doltdata:/var/lib/dolt
    ports:
      # Loopback-only per gateway hardening (#89): no database port on the
      # LAN. Device bd clients reach the queue over the TAILNET :3326 — the
      # balena serve edge forwards it as raw TCP to this publish.
      - "127.0.0.1:3326:3306"
    healthcheck:
      # Dolt's liveness query, AUTHENTICATED as the app user, with the
      # client flags as GLOBAL flags BEFORE the sql subcommand (the CLI
      # rejects them after it — proven live against dolt 2.3.5). The
      # password expands in the container's shell at probe time from the
      # service's own environment; a missing variable fails the check. `$$`
      # on both platforms: compose-go (docker compose AND `balena deploy`)
      # would otherwise interpolate it at deploy time — to "" on the release
      # runner (registrar-v1.5.2/1.5.3: dolt restart-looped every ~5 min) or
      # to the secret itself in `docker inspect` output.
      test: ["CMD-SHELL", "dolt --host 127.0.0.1 --port 3306 --no-tls -u vs -p \"$$DOLT_PASSWORD\" sql -q 'select current_timestamp();'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 60s
    restart: unless-stopped

  scotty:
    image: ${VS_IMAGE_REGISTRY:-ghcr.io/cwdcwd/vector-sigma}/scotty:${VS_IMAGE_TAG:?set in platforms/compose/.env — the commit SHA of a published build}
    environment:
      # Two-layer read-only posture (fleet-ops-8ea): SCOTTY_READ_ONLY=1, plus
      # the BD_BIN wrapper baked into the image (images/scotty/bd-readonly).
      SCOTTY_READ_ONLY: "1"
      # The .beads join-config workspace baked into the image; the in-image
      # bd reaches the dolt service over the compose network.
      BEADS_REPO: /queue-join
      BEADS_DOLT_PASSWORD: ${BEADS_DOLT_PASSWORD:?set in platforms/compose/.env}
    depends_on:
      dolt:
        condition: service_healthy
    # lnf (j7g phase 2): 127.0.0.1-ONLY publish — the serve edge fronts
    # scotty at the MagicDNS name :8444. Its lock is the tailnet ACL tag +
    # TLS identity alone.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      # HTTP liveness on /api/projects; bd errors surface as 5xx there, so
      # this also catches a wedged bd bridge.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3306/api/projects').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 60s
    restart: unless-stopped

  # ── f57.14: primus — the VS coordinator Hermes, self-bootstrapped ─────────
  # The dogfood proof: the master's own agent bootstraps through the SAME
  # chain every device uses — registrant-own fetches the owner-prepared
  # primus bundle from the registrar and applies it to the shared
  # primus-data volume. The official Hermes image has no marker gate
  # (f57.20); the marker-gap race is closed by the image's first-boot-only
  # seed + restart.
  hermes:
    # b1r: the pinned official Hermes image + bd 1.2.2 baked FULL READ-WRITE
    # (primus is the queue CURATOR) + the queue join + the environment docs
    # + the boot hooks. Fully rebuildable from the repo with zero manual steps.
    image: ${VS_IMAGE_REGISTRY:-ghcr.io/cwdcwd/vector-sigma}/hermes:${VS_IMAGE_TAG:?set in platforms/compose/.env — the commit SHA of a published build}
    # The image's CMD default is a bare REPL that exits on EOF; the upstream
    # reference compose's long-run form is `gateway run`.
    command: ["gateway", "run"]
    environment:
      HERMES_HOME: /data/primus
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      # Read the registrant-written (uid 1000) bundle: the image's HERMES_UID
      # remap (uid 10000 cannot read the 0600 files otherwise).
      HERMES_UID: "1000"
      HERMES_GID: "1000"
      BEADS_DOLT_PASSWORD: ${BEADS_DOLT_PASSWORD:?set in platforms/compose/.env — same value as DOLT_PASSWORD}
    volumes:
      - primus-data:/data/primus
    depends_on:
      registrant-own:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 60s
    restart: unless-stopped

  # f57.14: the master's OWN registrant (the same image every device runs).
  # Polls the compose-internal registrar and applies the primus bundle to
  # primus-data, writing /data/primus/ready.marker last.
  registrant-own:
    image: ${VS_IMAGE_REGISTRY:-ghcr.io/cwdcwd/vector-sigma}/registrant:${VS_IMAGE_TAG:?set in platforms/compose/.env — the commit SHA of a published build}
    environment:
      REGISTRAR_URL: http://registrar:3000
      BALENA_DEVICE_UUID: ${PRIMUS_DEVICE_UUID:?set in platforms/compose/.env — the master device UUID}
      REGISTRAR_KEY: ${PRIMUS_REGISTRAR_KEY:?set in platforms/compose/.env — the primus row's registrar key}
    volumes:
      - primus-data:/data/agent
    depends_on:
      registrar:
        condition: service_healthy
    healthcheck:
      # Process liveness only. Under the supervisor this never gated hermes
      # (no depends_on conditions); ordering safety is the registrant's own
      # retry loop + grace poll.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped

# Volumes: pgdata (postgres), doltdata (f57.15: the VS queue's Dolt state),
# primus-data (f57.14: primus state — bundle + ready marker from
# registrant-own; the hermes service's HERMES_HOME).
volumes:
  pgdata:
  doltdata:
  primus-data:
