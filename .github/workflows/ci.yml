name: CI

# Unit tests + typecheck. The compose E2E runs in build-images.yml, against
# the exact images CI built and scanned (.github/workflows/_images.yml).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (typecheck)
        run: npm run build
      - name: Unit tests
        run: npm test
      # The signed-identity guard (images/common/bin/vs-a2a-guard.py) is Python: run its suite with
      # the one dependency the images' Hermes venv provides.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: a2a-guard tests
        run: |
          python -m pip install --quiet 'cryptography>=42,<51'
          python -m unittest images/common/bin/test_vs_a2a_guard.py
