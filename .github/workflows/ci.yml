name: CI

# Unit tests + typecheck. The compose E2E runs in build-images.yml, against
# the exact images CI built and scanned (.github/workflows/_images.yml).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (typecheck)
        run: npm run build
      - name: Unit tests
        run: npm test
