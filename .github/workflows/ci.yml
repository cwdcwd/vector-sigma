name: CI

# Unit tests + typecheck. The compose E2E runs in build-images.yml, against
# the exact images CI built and scanned (.github/workflows/_images.yml).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build (typecheck)
        run: npm run build
      - name: Unit tests (with coverage floors)
        run: npm run test:coverage
      - name: Coverage summary
        run: node scripts/coverage-summary.mjs
      # The signed-identity guard (images/common/bin/vs-a2a-guard.py) is Python: run its suite with
      # the one dependency the images' Hermes venv provides.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: a2a-guard tests (with coverage floor)
        run: |
          python -m pip install --quiet 'cryptography>=42,<51' 'coverage>=7,<8'
          python -m coverage run --branch --include='images/common/bin/vs-a2a-guard.py' -m unittest images/common/bin/test_vs_a2a_guard.py
          { echo '### a2a-guard coverage'; echo; echo '```'; python -m coverage report; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          python -m coverage report --fail-under=90 > /dev/null  # floor: raise as coverage rises, never lower
      - name: vs-hub-router tests
        run: python -m unittest images/common/bin/test_vs_hub_router.py
      - name: boot-workflow tests
        run: python -m unittest images/common/bin/test_vs_bootworkflows.py
