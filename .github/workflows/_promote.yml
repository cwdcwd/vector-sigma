name: Image promotion (reusable)

# Publishes the bytes _images.yml built, scanned and E2E'd — nothing else.
# Callers invoke it from a `publish` job that `needs:` their _images.yml call
# (so every stage/scan, index and E2E job already passed — the call fails
# otherwise) and is gated on the owner switch VS_GHCR_PUBLISH_ENABLED. It
# runs in the SAME workflow run, so it reads that call's layout-<component>-*
# and index-<component> artifacts. Pull requests never call it.
#
#   plan          — the components this caller promotes (images.json fleet,
#                   optionally narrowed to one).
#   promote       — ONLY job with packages:write. Publishes the EXACT scanned
#                   OCI-layout bytes (scripts/ghcr-promote-run.mjs — no
#                   rebuild, no buildx), tagged with the commit SHA.
#   verify-remote — re-fetches every published digest anonymously and fails
#                   closed on any byte difference.
#
# Callers download the promoted-<component> records (same run) for their
# release tail (ledger, trivy, smoke, render, balena deploy).
on:
  workflow_call:
    inputs:
      promote_fleet:
        description: Fleet whose components are promoted (all | registrar | devices)
        type: string
        default: all
      promote_only:
        description: Narrow promotion to one component (all = the whole fleet)
        type: string
        default: all

permissions:
  contents: read

jobs:
  plan:
    name: Plan promotion (images.json)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      promote: ${{ steps.plan.outputs.promote }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        env:
          PROMOTE_FLEET: ${{ inputs.promote_fleet }}
          PROMOTE_ONLY: ${{ inputs.promote_only }}
        run: |
          set -euo pipefail
          echo "promote=$(node scripts/image-catalog.mjs components --fleet "$PROMOTE_FLEET" --only "$PROMOTE_ONLY")" \
            | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Only promote carries packages:write. fleet-ops-r3v: no rebuild — the exact scanned tars are
  # pushed through scripts/ghcr-promote-run.mjs (in-repo OCI Distribution
  # client); every blob/manifest is read back before any release tag is
  # applied. The GITHUB_TOKEN reaches the client only via GHCR_TOKEN.
  # ---------------------------------------------------------------------
  promote:
    name: Promote ${{ matrix.component }} (GHCR write, exact scanned bytes)
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.promote) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gate runtime deps
        run: npm ci
      - name: Build (typecheck) so the registry promoter dist/ exists
        run: npm run build
      - name: Download validated local index
        uses: actions/download-artifact@v4
        with:
          name: index-${{ matrix.component }}
          path: ${{ runner.temp }}
      - name: Download the exact scanned OCI layouts (amd64 + arm64)
        uses: actions/download-artifact@v4
        with:
          pattern: layout-${{ matrix.component }}-*
          path: ${{ runner.temp }}/layouts
          merge-multiple: true
      - name: Promote the exact scanned bytes to GHCR (no rebuild, no buildx)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          node scripts/ghcr-promote-run.mjs promote \
            --registry ghcr.io \
            --repository "${{ github.repository }}/${{ matrix.component }}" \
            --tag "${GITHUB_SHA}" \
            --layout "linux/amd64=${{ runner.temp }}/layouts/${{ matrix.component }}-amd64.tar" \
            --layout "linux/arm64=${{ runner.temp }}/layouts/${{ matrix.component }}-arm64.tar" \
            --token-env GHCR_TOKEN \
            --actor "${GHCR_ACTOR}" \
            --record "${{ runner.temp }}/promoted-${{ matrix.component }}.json"
      - name: Upload the promotion record (index + per-arch digests)
        uses: actions/upload-artifact@v4
        with:
          name: promoted-${{ matrix.component }}
          path: ${{ runner.temp }}/promoted-${{ matrix.component }}.json
          retention-days: 1

  verify-remote:
    name: Verify remote digests (${{ matrix.component }})
    needs: [plan, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.promote) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gate runtime deps
        run: npm ci
      - name: Build (typecheck) so the registry verifier dist/ exists
        run: npm run build
      - name: Download the promotion record
        uses: actions/download-artifact@v4
        with:
          name: promoted-${{ matrix.component }}
          path: ${{ runner.temp }}
      # Anonymous re-read: no packages:write and no credential, so the
      # proof that the published bytes are intact does not depend on the
      # writer's token.
      - name: Re-fetch by digest and compare (fails closed on any mismatch)
        run: |
          set -euo pipefail
          node scripts/ghcr-promote-run.mjs verify \
            --registry ghcr.io \
            --record "${{ runner.temp }}/promoted-${{ matrix.component }}.json"
