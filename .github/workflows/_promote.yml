name: Image promotion (reusable)

# Publishes the bytes _images.yml built, scanned and E2E'd — nothing else.
# Callers invoke it from a `publish` job that `needs:` their _images.yml call
# (so every stage/scan, index and E2E job already passed — the call fails
# otherwise) and is gated on the owner switch VS_GHCR_PUBLISH_ENABLED. It
# runs in the SAME workflow run, so it reads that call's layout-<component>-*
# and index-<component> artifacts. Pull requests never call it.
#
#   plan          — the components this caller promotes (images.json fleet,
#                   optionally narrowed to one).
#   promote       — ONLY job with packages:write. Publishes the EXACT scanned
#                   OCI-layout bytes digest for digest (scripts/publish-image.sh
#                   + the pinned regctl — no rebuild, no buildx), tagged with
#                   the commit SHA only after every manifest is read back.
#   verify-remote — re-fetches every published digest anonymously and fails
#                   closed on any byte difference.
#
# Callers download the promoted-<component> records (same run) for their
# release tail (ledger, trivy, smoke, render, balena deploy).
on:
  workflow_call:
    inputs:
      promote_fleet:
        description: Fleet whose components are promoted (all | registrar | devices)
        type: string
        default: all
      promote_only:
        description: Narrow promotion to one component (all = the whole fleet)
        type: string
        default: all

permissions:
  contents: read

jobs:
  plan:
    name: Plan promotion (images.json)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      promote: ${{ steps.plan.outputs.promote }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        env:
          PROMOTE_FLEET: ${{ inputs.promote_fleet }}
          PROMOTE_ONLY: ${{ inputs.promote_only }}
        run: |
          set -euo pipefail
          echo "promote=$(node scripts/image-catalog.mjs components --fleet "$PROMOTE_FLEET" --only "$PROMOTE_ONLY")" \
            | tee -a "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Only promote carries packages:write. No rebuild and no custom registry
  # client: scripts/publish-image.sh uses the pinned, checksum-verified
  # regctl to copy the EXACT scanned OCI layouts into GHCR digest for digest,
  # pushes the index the gate assembled (its bytes, unmodified), reads every
  # manifest back by digest, and only then applies tags. The token reaches
  # regctl via stdin login, in this job only.
  # ---------------------------------------------------------------------
  promote:
    name: Promote ${{ matrix.component }} (GHCR write, exact scanned bytes)
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.promote) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned regctl (sha256-verified)
        run: scripts/install-regctl.sh "${{ runner.temp }}" && echo "${{ runner.temp }}" >> "$GITHUB_PATH"
      - name: Download the exact scanned OCI layouts (amd64 + arm64)
        uses: actions/download-artifact@v4
        with:
          pattern: layout-${{ matrix.component }}-*
          path: ${{ runner.temp }}/layouts
          merge-multiple: true
      - name: Download the scan descriptors (the scanned manifest digests)
        uses: actions/download-artifact@v4
        with:
          pattern: descriptor-${{ matrix.component }}-*
          path: ${{ runner.temp }}/descriptors
          merge-multiple: true
      - name: Download the gate-assembled indexes
        uses: actions/download-artifact@v4
        with:
          name: indexes
          path: ${{ runner.temp }}/indexes
      - name: Log regctl in to GHCR (token via stdin, never printed)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | regctl registry login ghcr.io -u "$GHCR_ACTOR" --pass-stdin
      # Tag name: a release run (registrar-v* / devices-v* tag push) tags with
      # the release name; main tags with the commit SHA. Releases are cut from
      # commits main already published, and builds are not byte-reproducible,
      # so reusing the SHA would MOVE main's existing tags to different bytes
      # (registrar-v1.5.0 failed on exactly that). Records pin by digest; the
      # tag name is metadata, so the release tail is unaffected.
      - name: Publish the exact scanned bytes (by digest; tags last)
        env:
          PROMOTE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          set -euo pipefail
          scripts/publish-image.sh \
            --component "${{ matrix.component }}" \
            --registry ghcr.io \
            --repository "${{ github.repository }}/${{ matrix.component }}" \
            --tag "${PROMOTE_TAG}" \
            --layouts "${{ runner.temp }}/layouts" \
            --descriptors "${{ runner.temp }}/descriptors" \
            --index "${{ runner.temp }}/indexes/${{ matrix.component }}-index.json" \
            --record "${{ runner.temp }}/promoted-${{ matrix.component }}.json"
      - name: Upload the promotion record (index + per-arch digests)
        uses: actions/upload-artifact@v4
        with:
          name: promoted-${{ matrix.component }}
          path: ${{ runner.temp }}/promoted-${{ matrix.component }}.json
          retention-days: 1

  # One job re-reads every promoted component. Its own job on purpose: it
  # holds NO packages:write and logs in nowhere, so the proof that the
  # published bytes are intact never runs where a write-capable token exists.
  verify-remote:
    name: Verify remote digests (every promoted component)
    needs: [plan, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned regctl (sha256-verified)
        run: scripts/install-regctl.sh "${{ runner.temp }}" && echo "${{ runner.temp }}" >> "$GITHUB_PATH"
      - name: Download every promotion record
        uses: actions/download-artifact@v4
        with:
          pattern: promoted-*
          path: ${{ runner.temp }}/records
          merge-multiple: true
      # Anonymous re-read (an empty regctl config — no credential at all):
      # every digest must re-hash to itself and every tag must resolve to its
      # recorded digest. Checks every component, then fails if any failed.
      - name: Re-read every digest anonymously and compare (fails closed)
        env:
          COMPONENTS: ${{ needs.plan.outputs.promote }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          scripts/verify-published.sh "${{ runner.temp }}/records" \
            $(node -e 'for (const c of JSON.parse(process.env.COMPONENTS)) console.log(c)')
