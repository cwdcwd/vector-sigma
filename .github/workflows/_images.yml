name: Image pipeline (reusable)

# The ONE build/scan/E2E graph for every vector-sigma image. Called by
# build-images.yml (PRs + main), release-registrar.yml and release-devices.yml
# — each used to carry its own hand-copied matrix; images.json is now the only
# component list (scripts/image-catalog.mjs turns it into matrices). Holds NO
# write scope: publishing is the separate _promote.yml, which callers invoke
# from their own `publish` job only after this one succeeds.
#
# Build once, test those bytes, ship those bytes:
#
#   plan               — catalog -> build matrix (EVERY component, both
#                        platforms).
#   stage-and-scan     — per component/platform: credential-only scan of the
#                        image's exact build inputs (its Dockerfile + every
#                        COPY source — not the whole repo-root context), then
#                        buildx --output type=oci to a LOCAL layout tar (no
#                        push, no registry auth, no cache-from/cache-to —
#                        fleet-ops-1py.12 section 4), then the slice-4 content
#                        gate (registrar/src/oci-gate) on that tar.
#   e2e                — loads every component's scanned amd64 tar as
#                        vs-e2e/<component>:ci and runs the compose E2E
#                        against them (E2E_PREBUILT=1: no rebuild, a missing
#                        image fails). Every component is built on every
#                        call so the E2E always runs scanned bytes, whatever
#                        subset the caller promotes.
#   all-components-gate — aggregate, fail-closed: every stage/scan and E2E
#                        job succeeded; then assembles + validates each
#                        component's local OCI index from ONLY this run's
#                        scanned-and-passed digests. The call fails unless
#                        all of it does.
#
# The scanned layouts + indexes stay as run artifacts for _promote.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  plan:
    name: Plan (images.json)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      components: ${{ steps.plan.outputs.components }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        run: |
          set -euo pipefail
          {
            echo "matrix=$(node scripts/image-catalog.mjs matrix)"
            echo "components=$(node scripts/image-catalog.mjs components)"
          } | tee -a "$GITHUB_OUTPUT"

  stage-and-scan:
    name: Stage + scan ${{ matrix.component }} (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      # NO docker/login-action anywhere in this job — stage-and-scan never
      # authenticates to any registry, on any event.
      - name: Install gate runtime deps
        run: npm ci
      - name: Build (typecheck) so the gate dist/ exists
        run: npm run build
      - name: Credential-only scan of this image's build inputs (fleet-ops-1py.14 slice 6)
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r input; do args+=(--context "$input"); done \
            < <(node scripts/image-catalog.mjs inputs "$COMPONENT")
          node scripts/credential-scan-run.mjs "${args[@]}"
      - name: Build candidate to a local OCI layout (no push, no cache)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.component }}-${{ matrix.arch_tag }}.tar
          # Hard requirement (fleet-ops-1py.14 slice 5 design): zero
          # cache-from/cache-to on any candidate build, on any event.
          # Do not add one back "temporarily" — see docs/ghcr-image-
          # exposure-plan.md section B and fleet-ops-1py.12 section 4.
      - name: Run the slice-4 content gate on this platform's layout
        run: |
          set -euo pipefail
          node scripts/oci-gate-run.mjs scan \
            --component "${{ matrix.component }}" \
            --platform "${{ matrix.platform }}" \
            --tar "${{ runner.temp }}/${{ matrix.component }}-${{ matrix.arch_tag }}.tar" \
            --out "${{ runner.temp }}/${{ matrix.component }}-${{ matrix.arch_tag }}.descriptor.json"
      # CVE-2026-111497 (GHSA-9v8h-qqgm-4m35): GitHub has not mapped the Brotli advisory to any
      # package, so Trivy cannot flag it. Run the check inside the exact image just built (native
      # arch: each matrix leg runs on its own platform's runner) and fail on any vulnerable copy
      # of Brotli: node's built-in decoder, the libbrotlidec shared library, Python Brotli/brotlicffi.
      - name: Brotli CVE-2026-111497 check inside the built image
        run: |
          set -euo pipefail
          tar="${{ runner.temp }}/${{ matrix.component }}-${{ matrix.arch_tag }}.tar"
          img="vs-brotli-check/${{ matrix.component }}:${{ matrix.arch_tag }}"
          # buildx type=oci archives need skopeo, not docker load, on the runners' classic image
          # store (scripts/e2e-load-images.sh); the layer diff IDs prove these are the scanned bytes.
          want="$(node scripts/oci-layout-diffids.mjs "$tar")"
          skopeo copy --quiet "oci-archive:$tar" "docker-daemon:$img"
          got="$(docker image inspect -f '{{json .RootFS.Layers}}' "$img")"
          [ "$got" = "$want" ] || { echo "::error::$img layers $got != layout $want"; exit 1; }
          docker run --rm --platform "${{ matrix.platform }}" --entrypoint sh \
            -v "$PWD/scripts/brotli-cve-check.sh:/brotli-cve-check.sh:ro" "$img" /brotli-cve-check.sh
          docker image rm "$img" >/dev/null
      - name: Upload scanned descriptor for index assembly
        uses: actions/upload-artifact@v4
        with:
          name: descriptor-${{ matrix.component }}-${{ matrix.arch_tag }}
          path: ${{ runner.temp }}/${{ matrix.component }}-${{ matrix.arch_tag }}.descriptor.json
          retention-days: 1
      # The layout tar itself: E2E runs these bytes and promote publishes
      # them (fleet-ops-r3v) — never a rebuild.
      - name: Upload the scanned OCI layout (the exact bytes E2E runs and promote publishes)
        uses: actions/upload-artifact@v4
        with:
          name: layout-${{ matrix.component }}-${{ matrix.arch_tag }}
          path: ${{ runner.temp }}/${{ matrix.component }}-${{ matrix.arch_tag }}.tar
          retention-days: 1

  e2e:
    name: Compose E2E on the scanned amd64 images
    needs: stage-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the scanned amd64 layouts
        uses: actions/download-artifact@v4
        with:
          pattern: layout-*-amd64
          path: ${{ runner.temp }}/layouts
          merge-multiple: true
      - name: Load the ones the E2E runs as vs-e2e/<component>:ci
        run: |
          set -euo pipefail
          scripts/e2e-load-images.sh "${{ runner.temp }}/layouts"
          rm -rf "${{ runner.temp }}/layouts"   # the rest (agent, tailscale) frees disk
      - name: Compose-simulated device E2E (prebuilt — no rebuild)
        run: E2E_PREBUILT=1 test/e2e/e2e.sh --up
      - name: Teardown
        if: always()
        run: test/e2e/e2e.sh --down

  # One job, after everything: inspects every dep's result (fail-closed on
  # failure, cancel or skip), then assembles + validates each component's
  # local OCI index from ONLY this run's scanned-and-passed descriptors.
  # (Was a 9-job matrix; assembly is a fast node step, so one runner does it.)
  all-components-gate:
    name: All-components gate (scan + E2E + index assembly, fail-closed)
    if: always()
    needs: [plan, stage-and-scan, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every stage/scan and E2E job to have succeeded
        run: |
          set -euo pipefail
          for pair in "plan=${{ needs.plan.result }}" \
                      "stage-and-scan=${{ needs.stage-and-scan.result }}" \
                      "e2e=${{ needs.e2e.result }}"; do
            if [ "${pair#*=}" != "success" ]; then
              echo "${pair%%=*} did not succeed (result: ${pair#*=})" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gate runtime deps
        run: npm ci
      - name: Build (typecheck) so the oci-gate dist/ exists
        run: npm run build
      - name: Download every scanned descriptor
        uses: actions/download-artifact@v4
        with:
          pattern: descriptor-*
          path: ${{ runner.temp }}/descriptors
          merge-multiple: true
      - name: Assemble + validate each component's local OCI index from scanned digests only
        env:
          COMPONENTS: ${{ needs.plan.outputs.components }}
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/indexes"
          for c in $(node -e 'for (const c of JSON.parse(process.env.COMPONENTS)) console.log(c)'); do
            node scripts/oci-gate-run.mjs assemble \
              --component "$c" \
              --out "${{ runner.temp }}/indexes/$c-index.json" \
              --descriptors "${{ runner.temp }}/descriptors/$c-amd64.descriptor.json" \
                            "${{ runner.temp }}/descriptors/$c-arm64.descriptor.json"
          done
          echo "all-components-gate: every stage/scan and E2E job passed; every component's index assembled from scanned digests"
      - name: Upload the validated local indexes
        uses: actions/upload-artifact@v4
        with:
          name: indexes
          path: ${{ runner.temp }}/indexes
          retention-days: 1
