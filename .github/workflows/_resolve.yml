name: Release image resolution (reusable)

# Build once, deploy many. Every push to main already builds, scans, E2Es,
# publishes and verifies that commit's images (build-images.yml). A release is
# cut from such a commit, so it REUSES those exact verified images instead of
# rebuilding them — no build, scan or E2E here, and no GHCR write at all.
#
#   require-main-success — build-images.yml must have succeeded for this
#                          commit on main (waits while it is still running, so
#                          a tag pushed right after a merge works).
#   resolve              — per component of the fleet: main's tags for the
#                          commit -> digests; the index must be EXACTLY its two
#                          platform manifests; writes the promotion record the
#                          release tail consumes (scripts/resolve-published.sh).
#   verify-remote        — the same anonymous re-read publishing uses
#                          (scripts/verify-published.sh): a tag moved after
#                          main's run would be caught here.
#
# Callers download the promoted-<component> records for their release tail
# (ledger, trivy, smoke, render, balena deploy) exactly as before.
on:
  workflow_call:
    inputs:
      fleet:
        description: Fleet whose components the release deploys (registrar | devices)
        type: string
        required: true

permissions:
  contents: read

jobs:
  require-main-success:
    name: Require main's verified pipeline for this commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Wait for build-images on main at this commit to succeed (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/build-images.yml/runs?head_sha=${GITHUB_SHA}&branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "push")] | sort_by(.created_at) | last // empty | "\(.status) \(.conclusion) \(.html_url)"')"
            if [ -z "$run" ]; then
              echo "::error::no build-images run on main for ${GITHUB_SHA} — releases must be cut from a commit main has built and published"
              exit 1
            fi
            read -r status conclusion url <<< "$run"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "main's pipeline for ${GITHUB_SHA} succeeded: ${url}"
                exit 0
              fi
              echo "::error::main's build-images run for ${GITHUB_SHA} concluded '${conclusion}' (${url}) — fix or re-run it, then re-run this release"
              exit 1
            fi
            echo "main's build-images run for ${GITHUB_SHA} is ${status} (${url}) — waiting (${attempt}/90)"
            sleep 30
          done
          echo "::error::timed out after 45 minutes waiting for main's build-images run for ${GITHUB_SHA}"
          exit 1

  plan:
    name: Plan (images.json fleet)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      components: ${{ steps.plan.outputs.components }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: plan
        env:
          FLEET: ${{ inputs.fleet }}
        run: |
          set -euo pipefail
          echo "components=$(node scripts/image-catalog.mjs components --fleet "$FLEET")" | tee -a "$GITHUB_OUTPUT"

  resolve:
    name: Resolve main's verified ${{ matrix.component }} images
    needs: [require-main-success, plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.plan.outputs.components) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned regctl (sha256-verified)
        run: scripts/install-regctl.sh "${{ runner.temp }}" && echo "${{ runner.temp }}" >> "$GITHUB_PATH"
      - name: Resolve the commit's published digests (anonymous; exact-index check)
        run: |
          set -euo pipefail
          scripts/resolve-published.sh ghcr.io "${{ github.repository }}/${{ matrix.component }}" "${GITHUB_SHA}" \
            "${{ runner.temp }}/promoted-${{ matrix.component }}.json"
      - name: Upload the promotion record (index + per-arch digests)
        uses: actions/upload-artifact@v4
        with:
          name: promoted-${{ matrix.component }}
          path: ${{ runner.temp }}/promoted-${{ matrix.component }}.json
          retention-days: 1

  verify-remote:
    name: Verify remote digests (every component)
    needs: [plan, resolve]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned regctl (sha256-verified)
        run: scripts/install-regctl.sh "${{ runner.temp }}" && echo "${{ runner.temp }}" >> "$GITHUB_PATH"
      - name: Download every promotion record
        uses: actions/download-artifact@v4
        with:
          pattern: promoted-*
          path: ${{ runner.temp }}/records
          merge-multiple: true
      - name: Re-read every digest anonymously and compare (fails closed)
        env:
          COMPONENTS: ${{ needs.plan.outputs.components }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          scripts/verify-published.sh "${{ runner.temp }}/records" \
            $(node -e 'for (const c of JSON.parse(process.env.COMPONENTS)) console.log(c)')
