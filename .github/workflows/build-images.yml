name: Build and publish private VS images

# Every image, every change: the shared pipeline (.github/workflows/_images.yml)
# builds each images.json component once, credential-scans its inputs,
# content-gates the OCI layouts, runs the compose E2E on the scanned amd64
# bytes, and — on main, when publishing is enabled — promotes those exact
# bytes to GHCR tagged with the commit SHA (the tag deploy/compose.yaml's
# VS_IMAGE_TAG pins).
#
# `images` (every event) is read-only. `publish` — the ONLY job holding
# packages:write — calls _promote.yml after `images` succeeds, never on
# pull_request (structurally excluded), and only when the owner switch
# VS_GHCR_PUBLISH_ENABLED is set (docs/ghcr-promotion-runbook.md). Unset, a
# main push still builds, scans and E2Es; nothing is written.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'reports/**'
      - '.beads/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'reports/**'
      - '.beads/**'
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to promote after the full validation matrix passes (all = every component)'
        type: choice
        required: true
        default: all
        options:
          - all
          - registrar
          - registrant
          - scotty
          - hermes
          - postgres
          - litellm
          - tailscale
          - agent
          - tailscale-devices

permissions:
  contents: read

jobs:
  images:
    name: Build, scan, E2E
    uses: ./.github/workflows/_images.yml
    permissions:
      contents: read

  publish:
    name: Publish to GHCR
    if: github.event_name != 'pull_request' && vars.VS_GHCR_PUBLISH_ENABLED == 'true'
    needs: images
    uses: ./.github/workflows/_promote.yml
    permissions:
      contents: read
      packages: write
    with:
      promote_only: ${{ inputs.component || 'all' }}
