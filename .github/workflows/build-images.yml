name: Build and publish private VS images

# Every image, every change: the shared pipeline (.github/workflows/_images.yml)
# builds each images.json component once, credential-scans its inputs,
# content-gates the OCI layouts, runs the compose E2E on the scanned amd64
# bytes, and — on main, when publishing is enabled — promotes those exact
# bytes to GHCR tagged with the commit SHA (the tag deploy/compose.yaml's
# VS_IMAGE_TAG pins).
#
# PR events run the `validate` caller: build + scan + E2E only, with
# contents:read — no promote job can run (publish: false, and the token
# carries no packages:write).
#
# owner go-ahead: publishing is gated on the repo variable
# VS_GHCR_PUBLISH_ENABLED (docs/ghcr-promotion-runbook.md). Unset, a main
# push still builds, scans and E2Es; promote/verify skip.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'reports/**'
      - '.beads/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'reports/**'
      - '.beads/**'
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to promote after the full validation matrix passes (all = every component)'
        type: choice
        required: true
        default: all
        options:
          - all
          - registrar
          - registrant
          - scotty
          - hermes
          - postgres
          - litellm
          - tailscale
          - agent
          - tailscale-devices

permissions:
  contents: read

jobs:
  validate:
    name: Validate images (PR)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_images.yml
    permissions:
      contents: read
    with:
      publish: false

  publish:
    name: Build, scan, E2E, publish
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_images.yml
    permissions:
      contents: read
      packages: write
    with:
      publish: ${{ vars.VS_GHCR_PUBLISH_ENABLED == 'true' }}
      promote_only: ${{ inputs.component || 'all' }}
