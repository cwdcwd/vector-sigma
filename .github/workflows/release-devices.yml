name: Release devices fleet

# fleet-ops-1py.7 rung 2 ORIGINAL NOTES (component set / balena deploy shape
# retained): tags-only releases (owner ruling 2026-09-18) with PREBUILT
# images — the source-push action (balena-io/deploy-to-balena-action,
# balena push --source under the hood) is RETIRED. No source leaves the
# repo for builds; no drafts; the fleet pin advance stays the canary's job
# (docs/balena-architecture.md).
#
# fleet-ops-1py.14 slice 5: rebuilt the publish graph per Thanos's design
# (fleet-ops-1py.12) and docs/ghcr-image-exposure-plan.md section B so the
# slice-4 local content gate (registrar/src/oci-gate) runs on every
# component/platform BEFORE any GHCR write (same graph shape as
# release-registrar.yml, 3-component devices set: agent, registrant,
# tailscale-devices — the ninth family that build-images.yml never
# builds, per the plan doc):
#   stage-and-scan -> assemble-and-validate -> all-components-gate ->
#   promote (ONLY packages:write job, plus promote-manifest) ->
#   verify-remote -> scan / smoke / render / deploy (unchanged shapes).
# Real exact-byte GHCR import/promotion of the already-scanned local OCI
# tar (regctl or an in-repo OCI-Distribution client) remains the subject
# of the still-unresolved GHCR PoC flagged blocking in fleet-ops-1py.12;
# `promote` here still builds+pushes via buildx (no cache) post-gate,
# consistent with the registrar release workflow.
on:
  push:
    tags: ["devices-v*"]

permissions:
  contents: read

env:
  REGISTRY_NS: cwdcwd/vector-sigma
  BALENA_CLI_VERSION: "25.2.6"
  # sha256 of balena-cli-v25.2.6-linux-x64-standalone.tar.gz (pinned at lane
# time 2026-10-10 from the GitHub release API) — supply-chain posture matches
# the bd/scotty tarball pins: fail-loud on mismatch, never a floating fetch.
  BALENA_CLI_SHA256: "687ba0d0fd35fad6bb672763c739535b546fbf9aa5ab2909e670c5534a36e3d6"

jobs:
  stage-and-scan:
    name: Stage + scan ${{ matrix.component }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: agent
            context: balena/devices
            dockerfile: balena/devices/Dockerfile.agent-hermes
            platform: linux/amd64
            arch_tag: amd64
            runner: ubuntu-latest
          - component: agent
            context: balena/devices
            dockerfile: balena/devices/Dockerfile.agent-hermes
            platform: linux/arm64
            arch_tag: arm64
            runner: ubuntu-24.04-arm
          - component: registrant
            context: balena/registrar/registrant-own
            dockerfile: balena/registrar/registrant-own/Dockerfile
            platform: linux/amd64
            arch_tag: amd64
            runner: ubuntu-latest
          - component: registrant
            context: balena/registrar/registrant-own
            dockerfile: balena/registrar/registrant-own/Dockerfile
            platform: linux/arm64
            arch_tag: arm64
            runner: ubuntu-24.04-arm
          - component: tailscale-devices
            context: balena/devices
            dockerfile: balena/devices/Dockerfile.tailscale
            platform: linux/amd64
            arch_tag: amd64
            runner: ubuntu-latest
          - component: tailscale-devices
            context: balena/devices
            dockerfile: balena/devices/Dockerfile.tailscale
            platform: linux/arm64
            arch_tag: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3
      # NO docker/login-action in this job — stage-and-scan never
      # authenticates to any registry.
      - name: Install gate runtime deps
        run: npm ci
      - name: Build (typecheck) so the oci-gate dist/ exists
        run: npm run build
      - name: Build candidate to a local OCI layout (no push, no cache)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/${{ matrix.component }}-${{ matrix.arch_tag }}.tar
          # Hard requirement (fleet-ops-1py.14 slice 5): zero cache-from/
          # cache-to on any candidate build. Do not add one back.
      - name: Run the slice-4 content gate on this platform's layout
        run: |
          set -euo pipefail
          node scripts/oci-gate-run.mjs scan \
            --component "${{ matrix.component }}" \
            --platform "${{ matrix.platform }}" \
            --tar "${{ runner.temp }}/${{ matrix.component }}-${{ matrix.arch_tag }}.tar" \
            --out "${{ runner.temp }}/${{ matrix.component }}-${{ matrix.arch_tag }}.descriptor.json"
      - name: Upload scanned descriptor for index assembly
        uses: actions/upload-artifact@v4
        with:
          name: descriptor-${{ matrix.component }}-${{ matrix.arch_tag }}
          path: ${{ runner.temp }}/${{ matrix.component }}-${{ matrix.arch_tag }}.descriptor.json
          retention-days: 1
      # The layout tar itself, not just its descriptor: promote publishes
      # THESE bytes (fleet-ops-r3v) — the cryptographic link between what
      # was scanned and what is published.
      - name: Upload the scanned OCI layout (the exact bytes to be promoted)
        uses: actions/upload-artifact@v4
        with:
          name: layout-${{ matrix.component }}-${{ matrix.arch_tag }}
          path: ${{ runner.temp }}/${{ matrix.component }}-${{ matrix.arch_tag }}.tar
          retention-days: 1

  assemble-and-validate:
    name: Assemble + validate local index (${{ matrix.component }})
    needs: stage-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [agent, registrant, tailscale-devices]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gate runtime deps
        run: npm ci
      - name: Build (typecheck) so the oci-gate dist/ exists
        run: npm run build
      - name: Download scanned descriptors (amd64 + arm64)
        uses: actions/download-artifact@v4
        with:
          pattern: descriptor-${{ matrix.component }}-*
          path: ${{ runner.temp }}/descriptors
          merge-multiple: true
      - name: Assemble local OCI index from scanned digests only
        run: |
          set -euo pipefail
          node scripts/oci-gate-run.mjs assemble \
            --component "${{ matrix.component }}" \
            --out "${{ runner.temp }}/${{ matrix.component }}-index.json" \
            --descriptors "${{ runner.temp }}/descriptors/${{ matrix.component }}-amd64.descriptor.json" \
                          "${{ runner.temp }}/descriptors/${{ matrix.component }}-arm64.descriptor.json"
      - name: Upload validated local index
        uses: actions/upload-artifact@v4
        with:
          name: index-${{ matrix.component }}
          path: ${{ runner.temp }}/${{ matrix.component }}-index.json
          retention-days: 1

  all-components-gate:
    name: All-components content gate (aggregate, fail-closed)
    if: always()
    needs: [stage-and-scan, assemble-and-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require every stage/scan and index job to have succeeded
        run: |
          set -euo pipefail
          if [ "${{ needs.stage-and-scan.result }}" != "success" ]; then
            echo "stage-and-scan did not succeed for all component/platform jobs (result: ${{ needs.stage-and-scan.result }})" >&2
            exit 1
          fi
          if [ "${{ needs.assemble-and-validate.result }}" != "success" ]; then
            echo "assemble-and-validate did not succeed for all components (result: ${{ needs.assemble-and-validate.result }})" >&2
            exit 1
          fi
          echo "all-components-gate: every stage/scan and index-assembly job passed"

  # -----------------------------------------------------------------------
  # -----------------------------------------------------------------------
  # Promotion stage (fleet-ops-r3v — completes PR #61 review finding #4,
  # identical fix as release-registrar.yml): promote pushes the EXACT
  # scanned OCI-layout bytes via scripts/ghcr-promote-run.mjs (an in-repo
  # OCI Distribution v2 client — no buildx, no rebuild, no second build
  # context), re-reads every blob and manifest before applying any release
  # tag, and assembles+pushes the multi-arch index from ONLY the
  # scanned-and-passed child digests. A failure at any point leaves the
  # registry with no advertised release.
  #
  # NO docker/login-action: the GITHUB_TOKEN reaches the client only
  # through the GHCR_TOKEN environment variable and is exchanged for a
  # scoped bearer token; never a URL, log line, or error message.
  # -----------------------------------------------------------------------
  promote:
    name: Promote ${{ matrix.component }} (GHCR write, exact scanned bytes)
    if: vars.VS_GHCR_PUBLISH_ENABLED == 'true'
    needs: all-components-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [agent, registrant, tailscale-devices]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gate runtime deps
        run: npm ci
      - name: Build (typecheck) so the registry promoter dist/ exists
        run: npm run build
      - name: Download validated local index
        uses: actions/download-artifact@v4
        with:
          name: index-${{ matrix.component }}
          path: ${{ runner.temp }}
      - name: Download the exact scanned OCI layouts (amd64 + arm64)
        uses: actions/download-artifact@v4
        with:
          pattern: layout-${{ matrix.component }}-*
          path: ${{ runner.temp }}/layouts
          merge-multiple: true
      - name: Promote the exact scanned bytes to GHCR (no rebuild, no buildx)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          node scripts/ghcr-promote-run.mjs promote \
            --registry ghcr.io \
            --repository "${{ env.REGISTRY_NS }}/${{ matrix.component }}" \
            --tag "${GITHUB_SHA}" \
            --layout "linux/amd64=${{ runner.temp }}/layouts/${{ matrix.component }}-amd64.tar" \
            --layout "linux/arm64=${{ runner.temp }}/layouts/${{ matrix.component }}-arm64.tar" \
            --token-env GHCR_TOKEN \
            --actor "${GHCR_ACTOR}" \
            --record "${{ runner.temp }}/promoted-${{ matrix.component }}.json"
      - name: Upload the promotion record (index + per-arch digests)
        uses: actions/upload-artifact@v4
        with:
          name: promoted-${{ matrix.component }}
          path: ${{ runner.temp }}/promoted-${{ matrix.component }}.json
          retention-days: 1

  # promote-manifest is GONE (fleet-ops-r3v): its `docker buildx imagetools
  # create` was a second, independent index-assembly path. The promoter now
  # assembles and pushes the index itself, from ONLY the scanned-and-passed
  # child descriptors. One assembly path, one source of truth.

  verify-remote:
    name: Verify remote digests (${{ matrix.component }})
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: [agent, registrant, tailscale-devices]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gate runtime deps
        run: npm ci
      - name: Build (typecheck) so the registry verifier dist/ exists
        run: npm run build
      - name: Download the promotion record
        uses: actions/download-artifact@v4
        with:
          name: promoted-${{ matrix.component }}
          path: ${{ runner.temp }}
      # Anonymous re-read (public package): the proof that the published
      # bytes are intact does not depend on the writer's token. The verifier
      # re-fetches the published index AND every child BY DIGEST and
      # recomputes SHA-256 over the served bytes — trusting neither the
      # registry's Docker-Content-Digest header nor its own promote-time
      # return value.
      - name: Re-fetch by digest and compare (fails closed on any mismatch)
        run: |
          set -euo pipefail
          node scripts/ghcr-promote-run.mjs verify \
            --registry ghcr.io \
            --record "${{ runner.temp }}/promoted-${{ matrix.component }}.json"

  # r3v: ONE deterministic rollback ledger for the whole run — collated from
  # the verified promotion records only (no registry I/O, no credentials).
  # This is the artifact the rollback runbook cites: exact index + per-arch
  # digests per component, re-renderable without resolving any mutable tag.
  release-evidence:
    name: Release-evidence ledger (rollback)
    needs: verify-remote
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gate runtime deps
        run: npm ci --silent
      - name: Build (typecheck) so the ledger validator dist/ exists
        run: npm run build --silent
      - name: Download every promotion record
        uses: actions/download-artifact@v4
        with:
          pattern: promoted-*
          path: ${{ runner.temp }}/records
          merge-multiple: true
      - name: Collate the release-evidence ledger
        run: |
          set -euo pipefail
          node scripts/ghcr-promote-run.mjs ledger \
            --out release-evidence/release-evidence.json \
            --commit "${GITHUB_SHA}" \
            --ref "${GITHUB_REF_NAME}" \
            --run-id "${GITHUB_RUN_ID}" \
            --actor "${GITHUB_ACTOR}" \
            --component agent="${RUNNER_TEMP}/records/promoted-agent.json" \
            --component registrant="${RUNNER_TEMP}/records/promoted-registrant.json" \
            --component tailscale-devices="${RUNNER_TEMP}/records/promoted-tailscale-devices.json"
      - name: Upload the release-evidence ledger (rollback artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: release-evidence/release-evidence.json
          retention-days: 90
  scan:
    name: Vulnerability gate (trivy CRITICAL,HIGH)
    needs: verify-remote
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: true
      matrix:
        component: [agent, registrant, tailscale-devices]
    steps:
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download promotion records (r3v digest handoff)
        uses: actions/download-artifact@v4
        with:
          name: promoted-${{ matrix.component }}
          path: ${{ runner.temp }}/records
      - name: Resolve the promoted child digests from the record
        run: |
          set -euo pipefail
          RECORD="${{ runner.temp }}/records/promoted-${{ matrix.component }}.json"
          DIGESTS="$(node -e '
          const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
          const d=(p)=>(r.perPlatform||[]).find(x=>x&&x.platform===p)?.digest;
          const ok=(s)=>typeof s==="string"&&/^sha256:[0-9a-f]{64}$/.test(s);
          const amd=d("linux/amd64"), arm=d("linux/arm64");
          if(!ok(amd)||!ok(arm)) throw new Error("promoted record lacks verified amd64/arm64 child digests");
          console.log(amd+" "+arm);
          ' "$RECORD")"
          printf 'AMD64_DIGEST=%s\nARM64_DIGEST=%s\n' "${DIGESTS%% *}" "${DIGESTS##* }" >> "$GITHUB_ENV"
      - name: Scan the PROMOTED amd64 child bytes
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REGISTRY_NS }}/${{ matrix.component }}@${{ env.AMD64_DIGEST }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-setup-trivy: false
      - name: Scan the PROMOTED arm64 child bytes
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REGISTRY_NS }}/${{ matrix.component }}@${{ env.ARM64_DIGEST }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-setup-trivy: false

  smoke:
    name: Release image smoke gate
    needs: verify-remote
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download promotion records (r3v digest handoff)
        uses: actions/download-artifact@v4
        with:
          pattern: promoted-*
          path: ${{ runner.temp }}/records
          merge-multiple: true
      - name: Boot-path smoke (devices app components; digest-pinned to promotion records)
        run: scripts/release-smoke.sh cwdcwd/vector-sigma "${GITHUB_SHA}" devices "${RUNNER_TEMP}/records"

  render:
    name: Render digest-pinned compose
    needs: [smoke, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install renderer deps
        run: npm install --silent yaml@2.9.1
      - name: Log into GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download promotion records (r3v digest handoff)
        uses: actions/download-artifact@v4
        with:
          pattern: promoted-*
          path: ${{ runner.temp }}/records
          merge-multiple: true
      - name: Render balena digest-pinned compose pinned FROM the promotion records
        run: |
          set -euo pipefail
          node scripts/render-release-compose.mjs \
            --app devices \
            --registry-owner cwdcwd \
            --repo vector-sigma \
            --sha "$GITHUB_SHA" \
            --records-dir "${RUNNER_TEMP}/records" \
            --out release/devices
          echo "=== rendered compose ==="
          cat release/devices/docker-compose.yml
          echo "=== provenance ==="
          cat release/devices/devices.release.json
      - name: Upload render artifact
        uses: actions/upload-artifact@v4
        with:
          path: release/devices/
          name: devices-release-compose
          retention-days: 30

  deploy:
    name: balena deploy (prebuilts -> balenaCloud registry)
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Download rendered compose
        uses: actions/download-artifact@v4
        with:
          name: devices-release-compose
          path: release/devices
      - name: Log into GitHub Container Registry (pull prebuilts)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned balena CLI (sha256-verified)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/balena-cli.tar.gz \
            "https://github.com/balena-io/balena-cli/releases/download/v${BALENA_CLI_VERSION}/balena-cli-v${BALENA_CLI_VERSION}-linux-x64-standalone.tar.gz"
          echo "${BALENA_CLI_SHA256}  /tmp/balena-cli.tar.gz" | sha256sum -c -
          tar -xzf /tmp/balena-cli.tar.gz -C /opt
          /opt/balena/bin/balena version
      - name: balena login (token)
        run: /opt/balena/bin/balena login --token "${BALENA_TOKEN}"
        env:
          BALENA_TOKEN: ${{ secrets.BALENA_TOKEN }}
      - name: GHCR registry-secrets file (per-run GITHUB_TOKEN auth)
        run: |
          set -euo pipefail
          printf 'ghcr.io:\n  username: %s\n  password: %s\n' \
            "${{ github.actor }}" "${{ secrets.GITHUB_TOKEN }}" > /tmp/registry-secrets.yml
      - name: Deploy prebuilt images to ${{ vars.DEVICES_FLEET }}
        run: |
          set -euo pipefail
          cd release/devices
          /opt/balena/bin/balena deploy "${{ vars.DEVICES_FLEET }}" \
            --source . \
            --registry-secrets /tmp/registry-secrets.yml \
            --release-tag "git-tag" "${GITHUB_REF_NAME}" \
            --note "vector-sigma ${GITHUB_REF_NAME} — prebuilt images at ${GITHUB_SHA} (1py.14 slice 5)"
